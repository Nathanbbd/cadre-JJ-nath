<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aujourd'hui</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f1ea; --panel:#fbfaf6; --ink:#2e2b26; --muted:#8d877b; --faint:#a8a192;
    --faint2:#bdb6a6; --line:#e8e3d7; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.16);
    --accent:#b7791f; --soon:#d98324;
  }
  :root[data-theme="dark"] {
    --bg:#1b1a16; --panel:#201e19; --ink:#f2ede1; --muted:#b3ab99; --faint:#8f887a;
    --faint2:#6f685c; --line:#332f27; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.18);
    --accent:#f2b600; --soon:#f0a24a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--bg);
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }

  #head { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; padding: 32px 60px 10px; }
  #date { -webkit-flex: 1; flex: 1; }
  #dow { font-size: 40px; font-weight: 600; line-height: 1; text-transform: capitalize; }
  #dnum { font-size: 21px; color: var(--muted); margin-top: 6px; text-transform: capitalize; }
  #clock { font-size: 66px; font-weight: 600; line-height: 1; }

  /* carte météo façon widget */
  #wcard { margin: 6px 60px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px 28px 22px; }
  #wcTop { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
  #wcLeft { -webkit-flex: 1; flex: 1; }
  #wcCity { font-size: 24px; font-weight: 600; }
  #wcTemp { font-size: 76px; font-weight: 600; line-height: 0.95; }
  #wcTemp span { font-size: 34px; vertical-align: 34px; color: var(--muted); }
  #wcRight { text-align: right; padding-top: 6px; }
  #wcCond { font-size: 28px; font-weight: 600; }
  #wcHL { font-size: 24px; color: var(--muted); margin-top: 4px; }
  #wcHL b { color: var(--ink); font-weight: 600; }

  #wcHours { display: -webkit-flex; display: flex; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .hr { -webkit-flex: 1; flex: 1; text-align: center; padding: 4px 0; border-radius: 10px; }
  .hr .hl { font-size: 15px; color: var(--muted); }
  .hr .hi { height: 34px; margin: 3px 0 2px; }
  .hr .ht { font-size: 19px; font-weight: 600; }
  .hr.sun .hl { color: var(--accent); font-weight: 600; }
  .hr.now { background: var(--yellowsoft); }
  .hr.now .hl { color: var(--soon); font-weight: 700; }

  #rainAlert { display: none; margin-top: 14px; background: var(--yellowsoft); border-radius: 14px;
               padding: 12px 18px; font-size: 22px; font-weight: 500; color: var(--ink);
               -webkit-align-items: center; align-items: center; }
  #rainAlert.show { display: -webkit-flex; display: flex; }
  #rainAlert svg { width: 28px; height: 28px; -webkit-flex: none; flex: none; margin-right: 14px; }
  #rainAlert svg path { fill: none; stroke: var(--soon); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* bas : lumières à gauche, agenda à droite */
  #lower { display: -webkit-flex; display: flex; margin: 14px 60px 0; }
  #left { width: 470px; padding-right: 40px; }
  #agenda { -webkit-flex: 1; flex: 1; border-left: 1px solid var(--line); padding-left: 40px; }
  .secLbl { font-size: 18px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .evTime { width: 104px; font-size: 23px; font-weight: 600; color: var(--accent); -webkit-flex: none; flex: none; }
  .evTitle { font-size: 23px; }
  .evLoc { font-size: 16px; color: var(--muted); margin-top: 2px; }
  #agNone { font-size: 25px; color: var(--muted); margin-top: 14px; line-height: 1.3; }

  .room { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 12px; }
  .rIcon { width: 28px; height: 28px; -webkit-flex: none; flex: none; margin-right: 12px; }
  .rIcon svg { width: 28px; height: 28px; display: block; }
  .rName { -webkit-flex: 1; flex: 1; font-size: 24px; font-weight: 500; }
  .btn { font-size: 19px; font-weight: 600; padding: 8px 20px; border-radius: 12px; margin-left: 9px;
         border: 2px solid var(--line); color: var(--muted); background: transparent;
         -webkit-user-select: none; user-select: none; cursor: pointer; min-width: 54px; text-align: center; }
  .btn.on { border-color: var(--yellow); color: var(--accent); }
  .btn.act { background: var(--yellow); color: #2e2b26; border-color: var(--yellow); }
  .btn.offact { background: var(--line); color: var(--ink); border-color: var(--line); }
  #scenes { margin-top: 14px; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .scn { font-size: 18px; font-weight: 500; padding: 8px 16px; border-radius: 19px; margin: 0 9px 9px 0;
         background: var(--panel); border: 1px solid var(--line); color: var(--ink);
         -webkit-user-select: none; user-select: none; cursor: pointer; }
  .scn.act { background: var(--yellow); border-color: var(--yellow); color: #2e2b26; }

  /* bandeau métro */
  #metro { position: absolute; left: 60px; right: 60px; bottom: 50px;
           display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
           background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 24px; }
  #mRound { width: 50px; height: 50px; border-radius: 25px; background: #837902; color: #fff;
            font-size: 30px; font-weight: 700; text-align: center; line-height: 50px; -webkit-flex: none; flex: none; }
  #mMid { margin-left: 18px; -webkit-flex: 1; flex: 1; }
  #mDest { font-size: 25px; font-weight: 600; line-height: 1.1; }
  #mSub { font-size: 16px; color: var(--muted); margin-top: 2px; }
  #mTimes { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
  .mT { margin-left: 28px; text-align: center; -webkit-flex: none; flex: none; }
  .mT .n { font-size: 44px; font-weight: 700; line-height: 1; }
  .mT .u { font-size: 16px; color: var(--muted); }
  .mT.soon .n { color: var(--soon); }

  #foot { position: absolute; left: 60px; right: 60px; bottom: 14px; font-size: 13px; color: var(--faint2); }
  #foot span { float: right; }
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div id="date"><div id="dow"></div><div id="dnum"></div></div>
    <div id="clock"></div>
  </div>

  <div id="wcard">
    <div id="wcTop">
      <div id="wcLeft"><div id="wcCity">Levallois-Perret</div><div id="wcTemp"></div></div>
      <div id="wcRight"><div id="wcCond"></div><div id="wcHL"></div></div>
    </div>
    <div id="wcHours"></div>
    <div id="rainAlert"></div>
  </div>

  <div id="lower">
    <div id="left">
      <div class="secLbl">Lumières</div>
      <div class="room">
        <div class="rIcon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3z" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="rName">Chambre</div>
        <div class="btn on" onclick="light('chambre','on',this)">On</div>
        <div class="btn" onclick="light('chambre','off',this)">Off</div>
      </div>
      <div class="room">
        <div class="rIcon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3z" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="rName">Salon</div>
        <div class="btn on" onclick="light('salon','on',this)">On</div>
        <div class="btn" onclick="light('salon','off',this)">Off</div>
      </div>
      <div id="scenes">
        <div class="scn" onclick="scene('film',this)">Film</div>
        <div class="scn" onclick="scene('nuit',this)">Bonne nuit</div>
        <div class="scn" onclick="scene('reveil',this)">Réveil</div>
        <div class="scn" onclick="scene('off',this)">Tout éteindre</div>
      </div>
    </div>
    <div id="agenda">
      <div class="secLbl">Au programme aujourd'hui</div>
      <div id="agList"></div>
    </div>
  </div>

  <div id="metro">
    <div id="mRound">3</div>
    <div id="mMid"><div id="mDest">Louise Michel &#8594; Gallieni</div><div id="mSub">Prochains métros, direction Paris</div></div>
    <div id="mTimes"></div>
  </div>

  <div id="foot">Météo Open-Meteo · Levallois. Agenda Google. Métro temps réel IDFM.<span id="src"></span></div>
</div>

<script>
var AGENDA_URL = "";
var METRO_URL = "";
var LIGHT_URL = "https://tuya-appart.boisbourdinnathande.workers.dev";
var LAT = 48.8938, LON = 2.2870;
var REFRESH_MIN = 15;

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

function currentTheme() { var ov = (location.search.match(/theme=(light|dark)/) || [])[1]; return ov || "light"; }
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
function C(k) {
  var P = { light: { sun:"#f2b600", cloud:"#b4ac9c", rain:"#5b8fb0", snow:"#9aa0a6", bolt:"#f2b600" },
            dark:  { sun:"#f2b600", cloud:"#8f887a", rain:"#7cc4d6", snow:"#dfeaee", bolt:"#f2b600" } };
  return P[currentTheme()][k];
}

/* ---------- boutons lumière / scènes ---------- */
function light(room, cmd, btn) {
  var bs = btn.parentNode.getElementsByClassName("btn"), i;
  for (i = 0; i < bs.length; i++) { bs[i].className = bs[i].className.replace(/\s*(act|offact)/g, ""); }
  btn.className += (cmd === "on" ? " act" : " offact");
  if (!LIGHT_URL) return;
  try { var xhr = new XMLHttpRequest(); xhr.open("GET", LIGHT_URL + "?room=" + encodeURIComponent(room) + "&cmd=" + cmd); xhr.timeout = 8000; xhr.send(); } catch (e) {}
}
function scene(name, btn) {
  var ss = document.getElementById("scenes").getElementsByClassName("scn"), i;
  for (i = 0; i < ss.length; i++) { ss[i].className = ss[i].className.replace(/\s*act/g, ""); }
  btn.className += " act";
  setTimeout(function () { btn.className = btn.className.replace(/\s*act/g, ""); }, 1500);
  if (!LIGHT_URL) return;
  try { var xhr = new XMLHttpRequest(); xhr.open("GET", LIGHT_URL + "?scene=" + encodeURIComponent(name)); xhr.timeout = 8000; xhr.send(); } catch (e) {}
}

/* ---------- icônes météo ---------- */
function wIcon(code, px) {
  var s = C("sun"), c = C("cloud"), r = C("rain"), sn = C("snow"), b = C("bolt");
  function sun(cx, cy, rr) {
    var o = '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="' + s + '"/>';
    for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (rr + 6), y1 = cy + Math.sin(a) * (rr + 6), x2 = cx + Math.cos(a) * (rr + 13), y2 = cy + Math.sin(a) * (rr + 13); o += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + s + '" stroke-width="6" stroke-linecap="round"/>'; }
    return o;
  }
  var cloud = '<path d="M38 84h50a19 19 0 0 0 2-38 26 26 0 0 0-50-6 21 21 0 0 0-2 44z" fill="' + c + '"/>';
  var g = '';
  if (code === 0 || code === 1) g = sun(64, 62, 30);
  else if (code === 2) g = sun(44, 46, 22) + cloud;
  else if (code === 3) g = cloud;
  else if (code === 45 || code === 48) g = cloud + '<line x1="34" y1="94" x2="94" y2="94" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/><line x1="40" y1="104" x2="88" y2="104" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/>';
  else if (code >= 51 && code <= 67) g = cloud + '<line x1="46" y1="92" x2="40" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="64" y1="92" x2="58" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="82" y1="92" x2="76" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/>';
  else if (code >= 71 && code <= 77) g = cloud + '<circle cx="50" cy="100" r="4" fill="' + sn + '"/><circle cx="68" cy="100" r="4" fill="' + sn + '"/>';
  else if (code >= 80 && code <= 82) g = cloud + '<line x1="46" y1="92" x2="40" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/><line x1="66" y1="92" x2="60" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/><line x1="86" y1="92" x2="80" y2="110" stroke="' + r + '" stroke-width="7" stroke-linecap="round"/>';
  else if (code >= 95) g = cloud + '<path d="M60 90l-10 16h10l-8 14" fill="none" stroke="' + b + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  else g = cloud;
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + g + '</svg>';
}
function moonIcon(code, px) {
  var m = (currentTheme() === "dark") ? "#e8dfae" : "#c9a227", c = C("cloud");
  var moon = '<path d="M78 64a30 30 0 1 1-30-30 24 24 0 0 0 30 30z" fill="' + m + '"/>';
  if (code === 2) { var cloud = '<path d="M42 90h46a17 17 0 0 0 2-34 24 24 0 0 0-30-10 19 19 0 0 0-18 44z" fill="' + c + '"/>'; return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '"><path d="M70 50a22 22 0 1 1-22-22 18 18 0 0 0 22 22z" fill="' + m + '"/>' + cloud + '</svg>'; }
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + moon + '</svg>';
}
function sunsetIcon(px) {
  var s = C("sun"), m = C("cloud");
  var g = '<g>'
    + '<path d="M44 86a20 20 0 0 1 40 0" fill="' + s + '"/>'
    + '<line x1="30" y1="92" x2="98" y2="92" stroke="' + m + '" stroke-width="6" stroke-linecap="round"/>'
    + '<line x1="64" y1="40" x2="64" y2="58" stroke="' + s + '" stroke-width="6" stroke-linecap="round"/>'
    + '<path d="M54 50l10 10 10-10" fill="none" stroke="' + s + '" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'
    + '</g>';
  return '<svg viewBox="0 0 128 128" width="' + px + '" height="' + px + '">' + g + '</svg>';
}
function condText(code) {
  if (code === 0) return "Ciel dégagé";
  if (code === 1) return "Plutôt dégagé";
  if (code === 2) return "Nuageux";
  if (code === 3) return "Couvert";
  if (code === 45 || code === 48) return "Brouillard";
  if (code >= 51 && code <= 57) return "Bruine";
  if (code >= 61 && code <= 67) return "Pluie";
  if (code >= 71 && code <= 77) return "Neige";
  if (code >= 80 && code <= 82) return "Averses";
  if (code >= 95) return "Orage";
  return "—";
}

var WX = null, AG = null, MT = null, lastLoad = null;

function mockAgenda() {
  return { events: [
    { time: "09:30", title: "Point équipe (visio)", loc: "" },
    { time: "13:00", title: "Déjeuner avec Léa", loc: "Rue Rivay" },
    { time: "19:00", title: "Sport", loc: "Salle Levallois" }
  ] };
}
function mockMetro() { return { mins: [2, 6, 10] }; }

function renderWeather() {
  if (!WX) { el("wcCond").innerHTML = "Météo indisponible"; return; }
  el("wcTemp").innerHTML = Math.round(WX.temp) + "<span>°</span>";
  el("wcCond").innerHTML = condText(WX.code);
  el("wcHL").innerHTML = "&#8593; <b>" + Math.round(WX.tmax) + "°</b>&nbsp;&nbsp;&#8595; <b>" + Math.round(WX.tmin) + "°</b>";
  var ra = el("rainAlert"), umb = '<svg viewBox="0 0 24 24"><path d="M12 4V2.4"/><path d="M4 11a8 8 0 0 1 16 0z"/><path d="M12 11v7a2.2 2.2 0 0 0 4.3 0.6"/></svg>';
  if (WX.rain) {
    ra.className = "show";
    if (WX.rain.now) ra.innerHTML = umb + "Il pleut en ce moment — pense au parapluie";
    else ra.innerHTML = umb + "Pluie attendue vers " + WX.rain.hour + " h — prends un parapluie" + (WX.rain.prob != null ? " (" + WX.rain.prob + "%)" : "");
  } else { ra.className = ""; ra.innerHTML = ""; }
  var h = "", cols = WX.cols || [];
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], ic;
    if (col.type === "sunset" || col.type === "sunrise") ic = sunsetIcon(34);
    else if (col.night && col.code <= 2) ic = moonIcon(col.code, 34);
    else ic = wIcon(col.code, 34);
    var tt = (col.temp == null) ? "" : (Math.round(col.temp) + "°");
    var cls = "hr" + (col.type !== "hour" ? " sun" : "") + (col.now ? " now" : "");
    h += '<div class="' + cls + '"><div class="hl">' + col.label + '</div><div class="hi">' + ic + '</div><div class="ht">' + tt + '</div></div>';
  }
  el("wcHours").innerHTML = h;
}

function renderMetro() {
  var m = MT || mockMetro(), h = "";
  if (m.mins && m.mins.length) {
    for (var i = 0; i < m.mins.length && i < 3; i++) {
      var v = m.mins[i], soon = v <= 2 ? " soon" : "";
      var n = (v <= 0) ? '<span class="n">quai</span>' : '<span class="n">' + v + '</span> <span class="u">min</span>';
      h += '<div class="mT' + soon + '">' + n + '</div>';
    }
  }
  el("mTimes").innerHTML = h;
}

function render() {
  applyTheme();
  var now = new Date();
  el("dow").innerHTML = JOURS[now.getDay()];
  el("dnum").innerHTML = now.getDate() + " " + MOIS[now.getMonth()];
  el("clock").innerHTML = hhmm(now);
  renderWeather();

  var ag = AG || { events: [] };
  if (ag.events && ag.events.length) {
    var hh = "", nmax = Math.min(ag.events.length, 4);
    for (var i = 0; i < nmax; i++) {
      var e = ag.events[i];
      hh += '<div class="ev"><div class="evTime">' + (e.time || "journée") + '</div><div><div class="evTitle">' + e.title + '</div>' + (e.loc ? '<div class="evLoc">' + e.loc + '</div>' : '') + '</div></div>';
    }
    el("agList").innerHTML = hh;
  } else { el("agList").innerHTML = '<div id="agNone">Rien de prévu aujourd\'hui.<br>Profitez-en !</div>'; }

  renderMetro();
  el("src").innerHTML = lastLoad ? "Maj " + hhmm(lastLoad) : "";
}

/* ---------- météo : courant + heures + coucher du soleil ---------- */
/* Bande fixe de la journée : 6 h → minuit. */
function buildCols(j) {
  var H = j.hourly, now = new Date(), i;
  function findHour(y, mo, da, hh) {
    for (var k = 0; k < H.time.length; k++) {
      var d = new Date(H.time[k]);
      if (d.getFullYear() === y && d.getMonth() === mo && d.getDate() === da && d.getHours() === hh) return k;
    }
    return -1;
  }
  var y = now.getFullYear(), mo = now.getMonth(), da = now.getDate(), cols = [], idx, d;
  var sr0 = (j.daily && j.daily.sunrise) ? new Date(j.daily.sunrise[0]).getTime() : 0;
  var ss0 = (j.daily && j.daily.sunset) ? new Date(j.daily.sunset[0]).getTime() : 0;
  function isNight(t) { return (sr0 && ss0) ? (t < sr0 || t >= ss0) : false; }
  for (var hh = 6; hh <= 23; hh++) {
    idx = findHour(y, mo, da, hh); if (idx < 0) continue;
    d = new Date(H.time[idx]);
    cols.push({ t: d.getTime(), label: hh + " h", code: H.weather_code[idx], temp: H.temperature_2m[idx], type: "hour",
                now: (now.getHours() === hh), night: isNight(d.getTime()) });
  }
  /* minuit (0 h du lendemain) */
  var tom = new Date(y, mo, da + 1);
  idx = findHour(tom.getFullYear(), tom.getMonth(), tom.getDate(), 0);
  if (idx >= 0) { d = new Date(H.time[idx]); cols.push({ t: d.getTime(), label: "minuit", code: H.weather_code[idx], temp: H.temperature_2m[idx], type: "hour", night: true }); }
  if (!cols.length) return cols;
  /* coucher du soleil du jour, inséré dans la bande */
  if (j.daily && j.daily.sunset) {
    for (i = 0; i < j.daily.sunset.length; i++) {
      var ss = new Date(j.daily.sunset[i]).getTime();
      if (ss >= cols[0].t && ss <= cols[cols.length - 1].t) {
        cols.push({ t: ss, label: hhmm(new Date(ss)), temp: null, type: "sunset" });
      }
    }
  }
  cols.sort(function (a, b) { return a.t - b.t; });
  return cols;
}

/* Alerte pluie : 1re heure à venir aujourd'hui avec pluie probable. */
function computeRain(j) {
  var H = j.hourly, now = new Date(), y = now.getFullYear(), mo = now.getMonth(), da = now.getDate(), nowH = now.getHours();
  if (!H || !H.time) return null;
  for (var k = 0; k < H.time.length; k++) {
    var d = new Date(H.time[k]);
    if (d.getFullYear() !== y || d.getMonth() !== mo || d.getDate() !== da) continue;
    var hh = d.getHours(); if (hh < nowH) continue;
    var prob = H.precipitation_probability ? H.precipitation_probability[k] : null;
    var pr = H.precipitation ? H.precipitation[k] : 0;
    if (hh === nowH && pr >= 0.2) return { now: true };
    if ((prob != null && prob >= 50) || pr >= 0.5) return { now: false, hour: hh, prob: prob };
  }
  return null;
}

function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m" +
    "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation" +
    "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Europe%2FParis&forecast_days=2";
  var xhr = new XMLHttpRequest(); xhr.open("GET", url); xhr.timeout = 12000;
  xhr.onload = function () {
    if (xhr.status === 200) { try {
      var j = JSON.parse(xhr.responseText), c = j.current, d = j.daily;
      WX = { temp: c.temperature_2m, feels: c.apparent_temperature, code: c.weather_code, wind: c.wind_speed_10m,
             tmax: d.temperature_2m_max[0], tmin: d.temperature_2m_min[0], cols: buildCols(j), rain: computeRain(j) };
      lastLoad = new Date(); render();
    } catch (e) {} }
  };
  xhr.send();
}
function loadJSON(url, cb) {
  var xhr = new XMLHttpRequest(); xhr.open("GET", url); xhr.timeout = 12000;
  xhr.onload = function () { if (xhr.status === 200) { try { cb(JSON.parse(xhr.responseText)); } catch (e) {} } };
  xhr.send();
}
function loadAgenda() { if (!AGENDA_URL) { AG = mockAgenda(); render(); return; } loadJSON(AGENDA_URL, function (j) { AG = j; lastLoad = new Date(); render(); }); }
function loadMetro() { if (!METRO_URL) { MT = null; render(); return; } loadJSON(METRO_URL, function (j) { MT = j; render(); }); }
function loadAll() { loadWeather(); loadAgenda(); loadMetro(); }

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit(); applyTheme();

render();
loadAll();
function tick() { render(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); }
setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
setInterval(loadMetro, 60000);
setInterval(loadAll, REFRESH_MIN * 60000);
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aujourd'hui</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette crème + jaune, claire par défaut. */
  :root {
    --bg:#f4f1ea; --panel:#fbfaf6; --ink:#2e2b26; --muted:#8d877b; --faint:#a8a192;
    --faint2:#bdb6a6; --line:#e8e3d7; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.16);
    --accent:#b7791f; --soon:#d98324;
  }
  :root[data-theme="dark"] {
    --bg:#1b1a16; --panel:#201e19; --ink:#f2ede1; --muted:#b3ab99; --faint:#8f887a;
    --faint2:#6f685c; --line:#332f27; --yellow:#f2b600; --yellowsoft:rgba(242,182,0,0.18);
    --accent:#f2b600; --soon:#f0a24a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--bg);
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .cond { font-family: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif; }

  #head { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end;
          padding: 40px 60px 14px; }
  #date { -webkit-flex: 1; flex: 1; }
  #dow { font-size: 42px; font-weight: 600; line-height: 1; text-transform: capitalize; }
  #dnum { font-size: 22px; color: var(--muted); margin-top: 6px; text-transform: capitalize; }
  #clock { font-size: 74px; font-weight: 600; line-height: 1; }

  #body { display: -webkit-flex; display: flex; margin: 6px 60px 0; }

  #weather { width: 470px; padding-right: 40px; }
  #wTop { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #wIcon { width: 118px; height: 118px; -webkit-flex: none; flex: none; }
  #wTemp { font-size: 96px; font-weight: 600; line-height: 0.9; margin-left: 8px; }
  #wTemp span { font-size: 40px; vertical-align: 40px; color: var(--muted); }
  #wCond { font-size: 28px; margin-top: 4px; }
  #wMeta { font-size: 21px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  #wMeta b { color: var(--ink); font-weight: 600; }

  #agenda { -webkit-flex: 1; flex: 1; border-left: 1px solid var(--line); padding-left: 40px; }
  #agLbl { font-size: 19px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .ev { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline;
        padding: 11px 0; border-bottom: 1px solid var(--line); }
  .evTime { width: 110px; font-size: 25px; font-weight: 600; color: var(--accent); -webkit-flex: none; flex: none; }
  .evTitle { font-size: 25px; }
  .evLoc { font-size: 17px; color: var(--muted); margin-top: 2px; }
  #agNone { font-size: 27px; color: var(--muted); margin-top: 18px; line-height: 1.3; }

  /* Boutons lumière */
  #maison { margin-top: 30px; }
  #maisonLbl { font-size: 19px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .room { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 14px; }
  .rIcon { width: 30px; height: 30px; -webkit-flex: none; flex: none; margin-right: 14px; }
  .rIcon svg { width: 30px; height: 30px; display: block; }
  .rName { -webkit-flex: 1; flex: 1; font-size: 26px; font-weight: 500; }
  .btn { font-size: 20px; font-weight: 600; padding: 9px 22px; border-radius: 13px; margin-left: 10px;
         border: 2px solid var(--line); color: var(--muted); background: transparent;
         -webkit-user-select: none; user-select: none; cursor: pointer; min-width: 58px; text-align: center; }
  .btn.on { border-color: var(--yellow); color: var(--accent); }
  .btn.act { background: var(--yellow); color: #2e2b26; border-color: var(--yellow); }
  .btn.offact { background: var(--line); color: var(--ink); border-color: var(--line); }

  #scenes { margin-top: 18px; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .scn { font-size: 19px; font-weight: 500; padding: 9px 18px; border-radius: 20px; margin: 0 10px 10px 0;
         background: var(--panel); border: 1px solid var(--line); color: var(--ink);
         -webkit-user-select: none; user-select: none; cursor: pointer; }
  .scn.act { background: var(--yellow); border-color: var(--yellow); color: #2e2b26; }

  /* Bandeau métro façon écran de quai */
  #metro { position: absolute; left: 60px; right: 60px; bottom: 54px;
           display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
           background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 26px; }
  #mRound { width: 56px; height: 56px; border-radius: 28px; background: #837902; color: #fff;
            font-size: 34px; font-weight: 700; text-align: center; line-height: 56px; -webkit-flex: none; flex: none; }
  #mMid { margin-left: 20px; -webkit-flex: 1; flex: 1; }
  #mDest { font-size: 28px; font-weight: 600; line-height: 1.1; }
  #mSub { font-size: 17px; color: var(--muted); margin-top: 2px; }
  #mTimes { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
  .mT { margin-left: 30px; text-align: center; -webkit-flex: none; flex: none; }
  .mT .n { font-size: 50px; font-weight: 700; line-height: 1; }
  .mT .u { font-size: 18px; color: var(--muted); }
  .mT.soon .n { color: var(--soon); }

  #foot { position: absolute; left: 60px; right: 60px; bottom: 16px; font-size: 13px; color: var(--faint2); }
  #foot span { float: right; }
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <div id="date"><div id="dow"></div><div id="dnum"></div></div>
    <div id="clock"></div>
  </div>

  <div id="body">
    <div id="weather">
      <div id="wTop"><div id="wIcon"></div><div id="wTemp"></div></div>
      <div id="wCond"></div>
      <div id="wMeta"></div>

      <div id="maison">
        <div id="maisonLbl">Lumières</div>
        <div class="room">
          <div class="rIcon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3z" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="rName">Chambre</div>
          <div class="btn on" onclick="light('chambre','on',this)">On</div>
          <div class="btn" onclick="light('chambre','off',this)">Off</div>
        </div>
        <div class="room">
          <div class="rIcon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3z" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="rName">Salon</div>
          <div class="btn on" onclick="light('salon','on',this)">On</div>
          <div class="btn" onclick="light('salon','off',this)">Off</div>
        </div>
        <div id="scenes">
          <div class="scn" onclick="scene('film',this)">Film</div>
          <div class="scn" onclick="scene('nuit',this)">Bonne nuit</div>
          <div class="scn" onclick="scene('reveil',this)">Réveil</div>
          <div class="scn" onclick="scene('off',this)">Tout éteindre</div>
        </div>
      </div>
    </div>
    <div id="agenda">
      <div id="agLbl">Au programme aujourd'hui</div>
      <div id="agList"></div>
    </div>
  </div>

  <div id="metro">
    <div id="mRound">3</div>
    <div id="mMid"><div id="mDest">Louise Michel &#8594; Gallieni</div><div id="mSub">Prochains métros, direction Paris</div></div>
    <div id="mTimes"></div>
  </div>

  <div id="foot">Météo Open-Meteo · Levallois. Agenda Google. Métro temps réel IDFM.<span id="src"></span></div>
</div>

<script>
var AGENDA_URL = "";       /* Worker agenda (vide = exemple) */
var METRO_URL = "";        /* Worker métro (vide = exemple) */
var LAT = 48.8938, LON = 2.2870;
var REFRESH_MIN = 15;

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

/* ---------- boutons lumière ----------
   LIGHT_URL = base du Worker Tuya (phase 2). Vide = juste le retour visuel. */
var LIGHT_URL = "";
function light(room, cmd, btn) {
  var bs = btn.parentNode.getElementsByClassName("btn"), i;
  for (i = 0; i < bs.length; i++) { bs[i].className = bs[i].className.replace(/\s*(act|offact)/g, ""); }
  btn.className += (cmd === "on" ? " act" : " offact");
  if (!LIGHT_URL) return;
  try { var xhr = new XMLHttpRequest(); xhr.open("GET", LIGHT_URL + "?room=" + encodeURIComponent(room) + "&cmd=" + cmd); xhr.timeout = 8000; xhr.send(); } catch (e) {}
}
function scene(name, btn) {
  var ss = document.getElementById("scenes").getElementsByClassName("scn"), i;
  for (i = 0; i < ss.length; i++) { ss[i].className = ss[i].className.replace(/\s*act/g, ""); }
  btn.className += " act";
  setTimeout(function () { btn.className = btn.className.replace(/\s*act/g, ""); }, 1500);
  if (!LIGHT_URL) return;
  try { var xhr = new XMLHttpRequest(); xhr.open("GET", LIGHT_URL + "?scene=" + encodeURIComponent(name)); xhr.timeout = 8000; xhr.send(); } catch (e) {}
}

function currentTheme() { var ov = (location.search.match(/theme=(light|dark)/) || [])[1]; return ov || "light"; }
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
function C(k) {
  var P = { light: { sun:"#f2b600", cloud:"#b4ac9c", rain:"#5b8fb0", snow:"#9aa0a6", bolt:"#f2b600" },
            dark:  { sun:"#f2b600", cloud:"#8f887a", rain:"#7cc4d6", snow:"#dfeaee", bolt:"#f2b600" } };
  return P[currentTheme()][k];
}

function wIcon(code) {
  var s = C("sun"), c = C("cloud"), r = C("rain"), sn = C("snow"), b = C("bolt");
  function sun(cx, cy, rr) {
    var o = '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="' + s + '"/>';
    for (var i = 0; i < 8; i++) { var a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (rr + 6), y1 = cy + Math.sin(a) * (rr + 6), x2 = cx + Math.cos(a) * (rr + 14), y2 = cy + Math.sin(a) * (rr + 14); o += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + s + '" stroke-width="5" stroke-linecap="round"/>'; }
    return o;
  }
  var cloud = '<path d="M38 82h50a19 19 0 0 0 2-38 26 26 0 0 0-50-6 21 21 0 0 0-2 44z" fill="' + c + '"/>';
  var g = '';
  if (code === 0 || code === 1) g = sun(64, 60, 30);
  else if (code === 2) g = sun(44, 44, 22) + cloud;
  else if (code === 3) g = cloud;
  else if (code === 45 || code === 48) g = cloud + '<line x1="34" y1="92" x2="94" y2="92" stroke="' + c + '" stroke-width="5" stroke-linecap="round"/><line x1="40" y1="102" x2="88" y2="102" stroke="' + c + '" stroke-width="5" stroke-linecap="round"/>';
  else if (code >= 51 && code <= 67) g = cloud + '<line x1="46" y1="90" x2="40" y2="106" stroke="' + r + '" stroke-width="5" stroke-linecap="round"/><line x1="64" y1="90" x2="58" y2="106" stroke="' + r + '" stroke-width="5" stroke-linecap="round"/><line x1="82" y1="90" x2="76" y2="106" stroke="' + r + '" stroke-width="5" stroke-linecap="round"/>';
  else if (code >= 71 && code <= 77) g = cloud + '<text x="46" y="106" font-size="22" fill="' + sn + '">*</text><text x="66" y="106" font-size="22" fill="' + sn + '">*</text>';
  else if (code >= 80 && code <= 82) g = cloud + '<line x1="46" y1="90" x2="40" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="66" y1="90" x2="60" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/><line x1="86" y1="90" x2="80" y2="108" stroke="' + r + '" stroke-width="6" stroke-linecap="round"/>';
  else if (code >= 95) g = cloud + '<path d="M60 88l-10 16h10l-8 14" fill="none" stroke="' + b + '" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
  else g = cloud;
  return '<svg viewBox="0 0 128 128" width="118" height="118">' + g + '</svg>';
}
function condText(code) {
  if (code === 0) return "Ciel dégagé";
  if (code === 1) return "Plutôt dégagé";
  if (code === 2) return "Partiellement nuageux";
  if (code === 3) return "Couvert";
  if (code === 45 || code === 48) return "Brouillard";
  if (code >= 51 && code <= 57) return "Bruine";
  if (code >= 61 && code <= 67) return "Pluie";
  if (code >= 71 && code <= 77) return "Neige";
  if (code >= 80 && code <= 82) return "Averses";
  if (code >= 95) return "Orage";
  return "—";
}

var WX = null, AG = null, MT = null, lastLoad = null;

function mockAgenda() {
  return { events: [
    { time: "09:30", title: "Point équipe (visio)", loc: "" },
    { time: "13:00", title: "Déjeuner avec Léa", loc: "Rue Rivay" },
    { time: "19:00", title: "Sport", loc: "Salle Levallois" }
  ] };
}
function mockMetro() { return { mins: [2, 6, 10] }; }

function renderMetro() {
  var m = MT || mockMetro(), h = "";
  if (m.mins && m.mins.length) {
    for (var i = 0; i < m.mins.length && i < 3; i++) {
      var v = m.mins[i], soon = v <= 2 ? " soon" : "";
      var n = (v <= 0) ? '<span class="n">quai</span>' : '<span class="n">' + v + '</span> <span class="u">min</span>';
      h += '<div class="mT' + soon + '">' + n + '</div>';
    }
  } else { h = '<div class="mT"><span class="u">—</span></div>'; }
  el("mTimes").innerHTML = h;
}

function render() {
  applyTheme();
  var now = new Date();
  el("dow").innerHTML = JOURS[now.getDay()];
  el("dnum").innerHTML = now.getDate() + " " + MOIS[now.getMonth()];
  el("clock").innerHTML = hhmm(now);

  if (WX) {
    el("wIcon").innerHTML = wIcon(WX.code);
    el("wTemp").innerHTML = Math.round(WX.temp) + "<span>°</span>";
    el("wCond").innerHTML = condText(WX.code);
    var meta = "Ressenti <b>" + Math.round(WX.feels) + "°</b> · <b>" + Math.round(WX.tmin) + "°</b> / <b>" + Math.round(WX.tmax) + "°</b><br>Vent <b>" + Math.round(WX.wind) + " km/h</b>";
    if (WX.rainProb != null) meta += " · Pluie <b>" + WX.rainProb + "%</b>";
    el("wMeta").innerHTML = meta;
  } else { el("wCond").innerHTML = "Météo indisponible"; }

  var ag = AG || { events: [] };
  if (ag.events && ag.events.length) {
    var h = "";
    for (var i = 0; i < ag.events.length; i++) {
      var e = ag.events[i];
      h += '<div class="ev"><div class="evTime">' + (e.time || "journée") + '</div><div><div class="evTitle">' + e.title + '</div>' + (e.loc ? '<div class="evLoc">' + e.loc + '</div>' : '') + '</div></div>';
    }
    el("agList").innerHTML = h;
  } else { el("agList").innerHTML = '<div id="agNone">Rien de prévu aujourd\'hui.<br>Profitez-en !</div>'; }

  renderMetro();
  el("src").innerHTML = lastLoad ? "Maj " + hhmm(lastLoad) : "";
}

function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=1";
  var xhr = new XMLHttpRequest(); xhr.open("GET", url); xhr.timeout = 12000;
  xhr.onload = function () {
    if (xhr.status === 200) { try {
      var j = JSON.parse(xhr.responseText), c = j.current, d = j.daily;
      WX = { temp: c.temperature_2m, feels: c.apparent_temperature, code: c.weather_code, isDay: c.is_day, wind: c.wind_speed_10m,
             tmax: d.temperature_2m_max[0], tmin: d.temperature_2m_min[0], rainProb: (d.precipitation_probability_max ? d.precipitation_probability_max[0] : null) };
      lastLoad = new Date(); render();
    } catch (e) {} }
  };
  xhr.send();
}
function loadJSON(url, cb) {
  var xhr = new XMLHttpRequest(); xhr.open("GET", url); xhr.timeout = 12000;
  xhr.onload = function () { if (xhr.status === 200) { try { cb(JSON.parse(xhr.responseText)); } catch (e) {} } };
  xhr.send();
}
function loadAgenda() { if (!AGENDA_URL) { AG = mockAgenda(); render(); return; } loadJSON(AGENDA_URL, function (j) { AG = j; lastLoad = new Date(); render(); }); }
function loadMetro() { if (!METRO_URL) { MT = null; render(); return; } loadJSON(METRO_URL, function (j) { MT = j; render(); }); }
function loadAll() { loadWeather(); loadAgenda(); loadMetro(); }

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit(); applyTheme();

render();
loadAll();
function tick() { render(); setTimeout(tick, 60000 - (Date.now() % 60000) + 50); }
setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
setInterval(loadMetro, 60000);
setInterval(loadAll, REFRESH_MIN * 60000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses &amp; tâches</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: radial-gradient(1000px 820px at 85% 8%, rgba(255,165,95,0.48), rgba(0,0,0,0) 56%), linear-gradient(135deg,#d7466b 0%, #e8794f 55%, #f3b24a 100%); --panel:rgba(255,255,255,0.15); --ink:#fff6ef; --muted:rgba(255,246,239,0.82); --faint:rgba(255,246,239,0.60);
    --faint2:rgba(255,246,239,0.45); --line:rgba(255,255,255,0.28); --accent:#ff4e8a; --done:rgba(255,246,239,0.5); --ring:rgba(255,255,255,0.45);
  }
  :root[data-theme="dark"] {
    --bg: radial-gradient(1200px 720px at 72% 16%, rgba(255,70,150,0.38), rgba(0,0,0,0) 60%), radial-gradient(900px 620px at 14% 92%, rgba(255,120,40,0.28), rgba(0,0,0,0) 55%), linear-gradient(150deg,#2a0620 0%, #5c0f36 48%, #7a123f 100%); --panel:rgba(255,80,150,0.12); --ink:#ffe9f3; --muted:rgba(255,220,235,0.82); --faint:rgba(255,210,230,0.55);
    --faint2:rgba(255,210,230,0.42); --line:rgba(255,120,180,0.30); --accent:#ff2d95; --done:rgba(255,210,230,0.45); --ring:rgba(255,120,180,0.45);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Barlow", "Roboto", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--bg);
           -webkit-transform-origin: 0 0; transform-origin: 0 0; }

  #head { padding: 40px 56px 6px; }
  #title { font-size: 56px; font-weight: 600; margin: 0; line-height: 1; }
  #sub { font-size: 20px; color: var(--muted); margin-top: 10px; }

  #body { display: -webkit-flex; display: flex; margin: 24px 56px 0; }
  .col { -webkit-flex: 1; flex: 1; }
  .col.right { border-left: 1px solid var(--line); padding-left: 44px; margin-left: 44px; }
  .colLbl { font-size: 22px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .colLbl b { color: var(--accent); font-weight: 600; }

  .item { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 12px 10px; margin: 0 -10px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .item:active { background: var(--line); }
  .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--ring); -webkit-flex: none; flex: none; margin-right: 18px; box-sizing: border-box; }
  .item.done .box { border-color: var(--accent); background: var(--accent); position: relative; }
  .item.done .box:after { content: ""; position: absolute; left: 7px; top: 2px; width: 6px; height: 12px;
    border: solid #2e2b26; border-width: 0 3px 3px 0; -webkit-transform: rotate(45deg); transform: rotate(45deg); }
  .txt { font-size: 30px; }
  .item.done .txt { color: var(--done); text-decoration: line-through; }
  .empty { font-size: 26px; color: var(--muted); margin-top: 8px; }

  .scrollbox { max-height: 486px; overflow: hidden; }
  .scrollbtns { display: none; margin-top: 12px; }
  .scrollbtns.on { display: -webkit-flex; display: flex; }
  .scrollbtns button { -webkit-flex: 1; flex: 1; height: 56px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); font-size: 26px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .scrollbtns button + button { margin-left: 14px; }
  .scrollbtns button:active { background: var(--line); }

  #foot { position: absolute; left: 56px; right: 56px; bottom: 14px; font-size: 13px; color: var(--faint2); }
  #foot span { float: right; }
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <h1 id="title">Courses &amp; tâches</h1>
    <div id="sub">Touchez un article pour le cocher — ou modifiez depuis l'app « Nos listes » sur vos téléphones.</div>
  </div>

  <div id="body">
    <div class="col"><div class="colLbl">Courses <b id="cCount"></b></div>
      <div class="scrollbox" id="courses"></div>
      <div class="scrollbtns" id="sbC"><button onclick="scrollCol('courses',-1)">&#9650;</button><button onclick="scrollCol('courses',1)">&#9660;</button></div>
    </div>
    <div class="col right"><div class="colLbl">Tâches <b id="tCount"></b></div>
      <div class="scrollbox" id="taches"></div>
      <div class="scrollbtns" id="sbT"><button onclick="scrollCol('taches',-1)">&#9650;</button><button onclick="scrollCol('taches',1)">&#9660;</button></div>
    </div>
  </div>

  <div id="foot">Notre liste partagée.<span id="src"></span></div>
</div>

<script>
/* Source = Worker "liste-appart" (notre liste à nous, stockée sur Cloudflare KV).
   Réponse : { updated, courses:[{t,done}], taches:[{t,done}], hasTaches }. Vide = exemple. */
var WORKER_URL = "https://liste-appart.boisbourdinnathande.workers.dev";
var REFRESH_MIN = 2;
var LAT = 48.8938, LON = 2.2870;

function el(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

/* ---------- thème (clair par défaut, ?theme=dark pour tester) ---------- */
function sunTimes(lat, lon) {
  var rad = Math.PI/180, dayMs=86400000, J1970=2440588, J2000=2451545;
  function toDays(dt){ return dt.valueOf()/dayMs-0.5+J1970-J2000; }
  var d=toDays(new Date()), lw=rad*-lon, n=Math.round(d-0.0009-lw/(2*Math.PI));
  var ds=0.0009+lw/(2*Math.PI)+n, M=rad*(357.5291+0.98560028*ds);
  var L=M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
  var dec=Math.asin(Math.sin(rad*23.4397)*Math.sin(L));
  var Jt=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  var w0=Math.acos((Math.sin(rad*-0.833)-Math.sin(rad*lat)*Math.sin(dec))/(Math.cos(rad*lat)*Math.cos(dec)));
  var Js=J2000+(0.0009+(w0+lw)/(2*Math.PI)+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  function fromJ(j){ return new Date((j+0.5-J1970)*dayMs); }
  return { rise: fromJ(Jt-(Js-Jt)).getTime(), set: fromJ(Js).getTime() };
}
function isNight(){ try{ var s=sunTimes(48.894,2.287),n=Date.now(); return n<s.rise||n>s.set; }catch(e){ var h=new Date().getHours(); return h<8||h>=19; } }
function currentTheme() { var ov = (location.search.match(/theme=(light|dark)/) || [])[1]; return ov || (isNight() ? "dark" : "light"); }
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }

/* ---------- CSV ---------- */
function parseCSV(text) {
  var rows = [], row = [], cur = "", q = false, i, c;
  for (i = 0; i < text.length; i++) {
    c = text.charAt(i);
    if (q) {
      if (c === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ""; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c === '\r') { /* ignore */ }
      else cur += c;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function norm(s) { return (s || "").toLowerCase().replace(/[àâä]/g, "a").replace(/[éèêë]/g, "e").replace(/\s+/g, ""); }

/* ---------- données ---------- */
var DATA = null, lastLoad = null;

function mock() {
  return {
    courses: [ { t: "Lait", done: false }, { t: "Pain", done: false }, { t: "Œufs", done: true },
               { t: "Café", done: false }, { t: "Tomates", done: false }, { t: "Pâtes", done: true } ],
    taches:  [ { t: "Lessive", done: false }, { t: "Sortir le verre", done: true },
               { t: "Appeler le proprio", done: false }, { t: "Arroser les plantes", done: false } ]
  };
}

function renderList(id, items, countId) {
  var remaining = 0, h = "";
  if (!items || !items.length) { el(id).innerHTML = '<div class="empty">Rien pour l\'instant.</div>'; el(countId).innerHTML = ""; return; }
  for (var i = 0; i < items.length; i++) {
    if (!items[i].done) remaining++;
    var oc = items[i].id ? ' onclick="toggleItem(\'' + items[i].id + '\')"' : '';
    h += '<div class="item' + (items[i].done ? " done" : "") + '"' + oc + '><div class="box"></div><div class="txt">' + items[i].t + '</div></div>';
  }
  el(id).innerHTML = h;
  el(countId).innerHTML = remaining ? "· " + remaining + " à faire" : "· tout est fait";
}

/* défilement par boutons (le cadre tactile ne scrolle pas bien à la main) */
function scrollCol(id, dir) {
  var b = el(id); if (!b) return;
  b.scrollTop += dir * 260;
  updateScrollBtns();
}
function updateScrollBtns() {
  [["courses", "sbC"], ["taches", "sbT"]].forEach(function (p) {
    var box = el(p[0]), bar = el(p[1]); if (!box || !bar) return;
    bar.className = "scrollbtns" + (box.scrollHeight > box.clientHeight + 4 ? " on" : "");
  });
}

function render() {
  applyTheme();
  var d = DATA || mock();
  var hasT = !!(d.hasTaches || (d.taches && d.taches.length));
  var rightCol = document.querySelector(".col.right");
  if (rightCol) rightCol.style.display = hasT ? "" : "none";
  el("title").innerHTML = hasT ? "Courses &amp; tâches" : "Courses";
  renderList("courses", d.courses, "cCount");
  if (hasT) renderList("taches", d.taches, "tCount");
  el("src").innerHTML = lastLoad ? "Maj " + hhmm(lastLoad) : "Exemple";
  updateScrollBtns();
}

/* tap sur un article au cadre -> coche/décoche (synchro avec les iPhones) */
var busy = false;
function toggleItem(id) {
  if (!id || !DATA) return;
  [DATA.courses, DATA.taches].forEach(function (L) { if (L) for (var i = 0; i < L.length; i++) if (L[i].id === id) L[i].done = !L[i].done; });
  render();                                   /* retour visuel immédiat */
  busy = true;
  var x = new XMLHttpRequest(); x.open("GET", WORKER_URL + "/toggle?id=" + encodeURIComponent(id) + "&t_=" + Date.now()); x.timeout = 12000;
  x.onload = function () { busy = false; try { var j = JSON.parse(x.responseText); if (j && (j.courses || j.taches)) { DATA = { courses: j.courses || [], taches: j.taches || [], hasTaches: j.hasTaches }; lastLoad = new Date(); render(); } } catch (e) {} };
  x.onerror = x.ontimeout = function () { busy = false; };
  x.send();
}

function load() {
  if (busy) return;                           /* on ne recharge pas pendant qu'on coche */
  if (!WORKER_URL) { DATA = null; render(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open("GET", WORKER_URL + "?t=" + Date.now());
  xhr.timeout = 20000;
  xhr.onload = function () {
    if (xhr.status === 200) {
      try {
        var j = JSON.parse(xhr.responseText);
        if (j && (j.courses || j.taches)) {
          DATA = { courses: j.courses || [], taches: j.taches || [], hasTaches: j.hasTaches };
          lastLoad = new Date(); render();
        }
      } catch (e) {}
    }
  };
  xhr.send();
}

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), st = el("stage").style;
  st.webkitTransform = st.transform = "scale(" + s + ")";
  st.left = ((window.innerWidth - 1280 * s) / 2) + "px";
  st.top = ((window.innerHeight - 800 * s) / 2) + "px";
}
window.onresize = fit; fit(); applyTheme();

render();
load();
setInterval(load, REFRESH_MIN * 60000);
</script>
</body>
</html>

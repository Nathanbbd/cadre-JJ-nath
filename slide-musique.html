<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musique</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent:#6b56b0; --ink:#2b2724; --muted:#8a827a; --track:rgba(0,0,0,0.12); }
  html, body { margin:0; height:100%; overflow:hidden; background:#e9e7ef; }
  body { font-family:"Barlow","Roboto",Arial,sans-serif; color:var(--ink); }
  #stage { position:absolute; left:0; top:0; width:1280px; height:800px; -webkit-transform-origin:0 0; transform-origin:0 0;
           display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; padding:0 72px; -webkit-box-sizing:border-box; box-sizing:border-box; }
  #cover { width:498px; height:498px; -webkit-flex:none; flex:none; border-radius:28px; background-size:cover; background-position:center;
           background-color:rgba(0,0,0,0.08); box-shadow:0 30px 70px rgba(0,0,0,0.33); }
  #info { -webkit-flex:1; flex:1; padding-left:64px; min-width:0; position:relative; }
  #source { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; font-size:21px; font-weight:700; letter-spacing:2px; color:var(--muted); }
  #eq { display:-webkit-flex; display:flex; -webkit-align-items:flex-end; align-items:flex-end; height:22px; margin-right:12px; }
  #eq i { width:5px; margin-right:3px; background:var(--accent); border-radius:2px; display:block;
          -webkit-animation:eq 0.9s ease-in-out infinite alternate; animation:eq 0.9s ease-in-out infinite alternate; }
  #eq.off i { -webkit-animation:none; animation:none; height:6px; }
  #eq i:nth-child(1){height:10px;-webkit-animation-delay:0s;animation-delay:0s;}
  #eq i:nth-child(2){height:20px;-webkit-animation-delay:0.2s;animation-delay:0.2s;}
  #eq i:nth-child(3){height:14px;-webkit-animation-delay:0.4s;animation-delay:0.4s;}
  @-webkit-keyframes eq { from{-webkit-transform:scaleY(0.4);} to{-webkit-transform:scaleY(1);} }
  @keyframes eq { from{transform:scaleY(0.4);} to{transform:scaleY(1);} }
  #title { font-family:"Playfair Display",Georgia,serif; font-size:78px; font-weight:800; line-height:1; margin:14px 0 0;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artist { font-size:34px; color:var(--muted); margin-top:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #msg { font-size:30px; color:var(--muted); margin-top:8px; display:none; }
  #bar { margin-top:36px; height:8px; border-radius:4px; background:var(--track); position:relative; }
  #fill { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--accent); width:0; }
  #knob { position:absolute; top:50%; left:0; width:22px; height:22px; border-radius:11px; background:var(--accent); -webkit-transform:translate(-50%,-50%); transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  #times { display:-webkit-flex; display:flex; -webkit-justify-content:space-between; justify-content:space-between; font-size:19px; color:var(--muted); margin-top:12px; }
  #ctrls { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; margin-top:34px; }
  .cbtn { border-radius:50%; background:rgba(255,255,255,0.72); display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.12); -webkit-user-select:none; user-select:none; }
  .side { width:84px; height:84px; }
  #play { width:122px; height:122px; background:var(--accent); margin:0 30px; box-shadow:0 10px 26px rgba(0,0,0,0.22); }
  .side svg { width:38px; height:38px; } #play svg { width:46px; height:46px; }
  .side .ic { fill:var(--accent); } #play .ic { fill:#fff; }
  #vol { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; margin-top:40px; }
  #vol .sp { width:34px; height:34px; margin-right:16px; -webkit-flex:none; flex:none; }
  #vol .sp .ic { fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .vbtn { width:62px; height:62px; border-radius:31px; background:rgba(255,255,255,0.72); -webkit-flex:none; flex:none; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; font-size:34px; font-weight:600; color:var(--ink); cursor:pointer; box-shadow:0 5px 14px rgba(0,0,0,0.1); -webkit-user-select:none; user-select:none; }
  #vtrack { -webkit-flex:1; flex:1; height:8px; border-radius:4px; background:var(--track); margin:0 18px; position:relative; }
  #vfill { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--accent); width:0; }
  #vknob { position:absolute; top:50%; left:0; width:22px; height:22px; border-radius:11px; background:var(--accent); -webkit-transform:translate(-50%,-50%); transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  #vval { font-size:26px; font-weight:600; width:58px; text-align:right; -webkit-flex:none; flex:none; margin-left:8px; }
  img#probe { display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="cover"></div>
  <div id="info">
    <div id="source"><span id="eq"><i></i><i></i><i></i></span><span id="src">SPOTIFY</span></div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="msg">Chargement…</div>
    <div id="bar"><div id="fill"></div><div id="knob"></div></div>
    <div id="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
    <div id="ctrls">
      <div class="cbtn side" id="prev"><svg viewBox="0 0 24 24"><path class="ic" d="M7 6v12M19 6l-9 6 9 6z"/></svg></div>
      <div class="cbtn" id="play"></div>
      <div class="cbtn side" id="next"><svg viewBox="0 0 24 24"><path class="ic" d="M17 6v12M5 6l9 6-9 6z"/></svg></div>
    </div>
    <div id="vol">
      <span class="sp"><svg viewBox="0 0 24 24"><path class="ic" d="M4 9v6h4l5 4V5L8 9z"/><path class="ic" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></span>
      <div class="vbtn" id="vminus">&#8722;</div>
      <div id="vtrack"><div id="vfill"></div><div id="vknob"></div></div>
      <div class="vbtn" id="vplus">+</div>
      <div id="vval">0</div>
    </div>
  </div>
</div>
<img id="probe" crossorigin="anonymous">

<script>
var WORKER = "https://spotify-appart.boisbourdinnathande.workers.dev";
var POLL_MS = 4000;

var PLAY_SVG = '<svg viewBox="0 0 24 24"><path class="ic" d="M7 5l12 7-12 7z"/></svg>';
var PAUSE_SVG = '<svg viewBox="0 0 24 24"><rect class="ic" x="6" y="5" width="4.5" height="14" rx="1.2"/><rect class="ic" x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>';

function el(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function mix(c,t,target){ return [c[0]+(target-c[0])*t, c[1]+(target-c[1])*t, c[2]+(target-c[2])*t]; }
function css(c){ return "rgb("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+")"; }
function lum(c){ return 0.299*c[0]+0.587*c[1]+0.114*c[2]; }
function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }

function extract(img){
  var n=16, cv=document.createElement("canvas"); cv.width=cv.height=n; var x=cv.getContext("2d");
  try{ x.drawImage(img,0,0,n,n); var d=x.getImageData(0,0,n,n).data; }catch(e){ return null; }
  var ar=0,ag=0,ab=0,cnt=0, best=null, bestScore=-1;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2]; ar+=r;ag+=g;ab+=b;cnt++;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b), sat=mx===0?0:(mx-mn)/mx, sc=sat*(mx/255);
    if(sc>bestScore){ bestScore=sc; best=[r,g,b]; }
  }
  var avg=[ar/cnt,ag/cnt,ab/cnt], accent=best||avg;
  if(lum(accent)>205) accent=mix(accent,0.35,40);
  if(lum(accent)<55)  accent=mix(accent,0.4,200);
  return { avg:avg, accent:accent };
}
function applyTint(t){
  if(!t) return;
  document.documentElement.style.setProperty("--accent", css(t.accent));
  var bgA=mix(t.avg,0.80,243), bgB=mix(t.avg,0.92,255);
  document.body.style.background="-webkit-linear-gradient(135deg,"+css(bgA)+","+css(bgB)+")";
  document.body.style.background="linear-gradient(135deg,"+css(bgA)+","+css(bgB)+")";
}

var state = { playing:false, progress:0, duration:0, lastFetch:0, volume:0, has:false };
var curCover = "";

function setPlay(p){ el("play").innerHTML = p ? PAUSE_SVG : PLAY_SVG; el("eq").className = p ? "" : "off"; }
function setVol(v){ state.volume=v; el("vval").textContent=v; el("vfill").style.width=v+"%"; el("vknob").style.left=v+"%"; }
function msg(t){ el("msg").textContent=t||""; el("msg").style.display=t?"block":"none"; }

function applyData(d){
  if(!d){ return; }
  if(!d.connected){ state.has=false; el("title").textContent=""; el("artist").textContent=""; msg("Spotify non connecté"); setPlay(false); return; }
  if(!d.hasTrack){ state.has=false; el("title").textContent=""; el("artist").textContent=""; el("cover").style.backgroundImage=""; msg("Rien en lecture"); setPlay(false); return; }
  msg(""); state.has=true;
  el("title").textContent = d.title;
  el("artist").textContent = d.artist;
  el("tdur").textContent = fmt(d.duration);
  state.duration=d.duration; state.progress=d.progress; state.playing=d.playing; state.lastFetch=Date.now();
  if(d.volume!=null) setVol(d.volume);
  setPlay(d.playing);
  if(d.cover && d.cover!==curCover){
    curCover=d.cover;
    var proxied=WORKER+"/img?u="+encodeURIComponent(d.cover);
    el("cover").style.backgroundImage='url("'+proxied+'")';
    var probe=el("probe"); probe.onload=function(){ applyTint(extract(probe)); }; probe.src=proxied;
  }
  tickProgress();
}
function tickProgress(){
  if(!state.has) return;
  var pr=state.progress + (state.playing ? (Date.now()-state.lastFetch)/1000 : 0);
  if(state.duration>0) pr=Math.min(pr,state.duration);
  el("tcur").textContent=fmt(pr);
  var pct=state.duration>0 ? (pr/state.duration*100) : 0;
  el("fill").style.width=pct+"%"; el("knob").style.left=pct+"%";
}

function load(){
  var x=new XMLHttpRequest(); try{ x.open("GET", WORKER+"?t="+Date.now()); }catch(e){}
  x.timeout=10000;
  x.onload=function(){
    if(x.status===200){ try{ applyData(JSON.parse(x.responseText)); return; }catch(e){ msg("Réponse illisible"); return; } }
    msg("Worker : HTTP " + x.status);
  };
  x.onerror=function(){ msg("Connexion au worker impossible"); };
  x.ontimeout=function(){ msg("Worker : délai dépassé"); };
  try{ x.send(); }catch(e){ msg("Erreur : " + (e && e.message)); }
}
function cmd(a,v){
  var u=WORKER+"/cmd?a="+a+(v!=null?"&v="+v:"");
  var x=new XMLHttpRequest(); try{ x.open("GET",u); }catch(e){}
  x.onload=function(){ setTimeout(load,350); };
  try{ x.send(); }catch(e){}
}

el("play").onclick=function(){ var np=!state.playing; state.playing=np; setPlay(np); cmd(np?"play":"pause"); };
el("prev").onclick=function(){ cmd("prev"); };
el("next").onclick=function(){ cmd("next"); };
el("vminus").onclick=function(){ var v=clamp((state.volume||0)-10,0,100); setVol(v); cmd("vol",v); };
el("vplus").onclick=function(){ var v=clamp((state.volume||0)+10,0,100); setVol(v); cmd("vol",v); };

function fit(){
  var s=Math.min(window.innerWidth/1280, window.innerHeight/800), st=el("stage").style;
  st.webkitTransform=st.transform="scale("+s+")";
  st.left=((window.innerWidth-1280*s)/2)+"px"; st.top=((window.innerHeight-800*s)/2)+"px";
}
window.onresize=fit; fit();
setPlay(false);
load();
setInterval(load, POLL_MS);
setInterval(tickProgress, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadre maison — Levallois</title>
<style>
  /* Shell. Nav verticale à GAUCHE. Palette crème + jaune, claire par défaut.
     Compatible WebView Android 6 / Chrome 106. */
  :root {
    --shellbg:#f4f1ea; --navbg:#fbfaf6; --navsep:rgba(40,36,30,0.08);
    --navic:#8d877b; --navactive:#f2b600; --navactiveic:#2e2b26; --prog:#f2b600;
  }
  :root[data-theme="dark"] {
    --shellbg:#1b1a16; --navbg:#201e19; --navsep:rgba(255,255,255,0.08);
    --navic:#b3ab99; --navactive:#f2b600; --navactiveic:#201e19; --prog:#f2b600;
  }
  html, body { margin: 0; height: 100%; background: var(--shellbg); overflow: hidden; }
  body { font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
         display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }

  /* Barre de nav verticale à gauche */
  #nav {
    width: 74px; height: 100vh; background: var(--navbg);
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-flex: none; flex: none; z-index: 10;
    border-right: 1px solid var(--navsep);
  }
  .navBtn {
    -webkit-flex: 1; flex: 1; width: 100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    cursor: pointer; border-bottom: 1px solid var(--navsep);
    -webkit-transition: background 0.25s ease; transition: background 0.25s ease;
  }
  .navBtn:last-child { border-bottom: 0; }
  .navBtn svg { width: 26px; height: 26px; display: block; }
  .navBtn .ic { fill: none; stroke: var(--navic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navBtn.active { background: var(--navactive); }
  .navBtn.active .ic { stroke: var(--navactiveic); }

  /* Zone des slides */
  #stageWrap { -webkit-flex: 1; flex: 1; position: relative; height: 100vh; }
  .slide {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; -webkit-transition: opacity 0.6s ease; transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.on { opacity: 1; pointer-events: auto; }

  /* Liseré de progression en haut de la zone slides */
  #prog { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 11; }
  #progFill { height: 100%; width: 0; background: var(--prog); }

  /* Petit rond discret "en pause" (quand on touche une slide) — appuyer = reprendre */
  #pauseBadge {
    position: absolute; left: 18px; bottom: 18px; z-index: 20; display: none;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,0.28); cursor: pointer; opacity: 0.55;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
  }
  #pauseBadge.on { display: -webkit-flex; display: flex; }
  #pauseBadge svg { display: block; width: 15px; height: 15px; margin-left: 2px; }
  #pauseBadge svg .ic { fill: #fff; }

  /* écran de veille (nuit) */
  #veille { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 50;
            display: none; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  #veille.on { display: -webkit-flex; display: flex; }
  #vclock { color: #1c1c1c; font-family: "Roboto", Arial, sans-serif; font-size: 120px; font-weight: 300; letter-spacing: 2px; }
</style>
</head>
<body>

  <div id="nav">
    <div class="navBtn" data-i="0" title="Aujourd'hui">
      <svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="4"/><path class="ic" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
    </div>
    <div class="navBtn" data-i="1" title="Courses &amp; tâches">
      <svg viewBox="0 0 24 24"><path class="ic" d="M4.5 8.5h15l-1.4 10.2a1 1 0 0 1-1 .8H6.9a1 1 0 0 1-1-.8z"/><path class="ic" d="M8 8.5a4 4 0 0 1 8 0"/><path class="ic" d="M9.3 12v4m5.4-4v4"/></svg>
    </div>
    <div class="navBtn" data-i="2" title="Agenda">
      <svg viewBox="0 0 24 24"><rect class="ic" x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path class="ic" d="M3.5 9.5h17"/><path class="ic" d="M8 3.5v3M16 3.5v3"/></svg>
    </div>
    <div class="navBtn" data-i="3" title="Trajets">
      <svg viewBox="0 0 24 24"><rect class="ic" x="6" y="3.5" width="12" height="13.5" rx="3.5"/><path class="ic" d="M6 10.5h12"/><path class="ic" d="M9 7h6"/><path class="ic" d="M8.5 17 6.5 20.5M15.5 17l2 3.5"/></svg>
    </div>
    <div class="navBtn" data-i="4" title="Photos">
      <svg viewBox="0 0 24 24"><rect class="ic" x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle class="ic" cx="9" cy="10.5" r="1.8"/><path class="ic" d="M4.5 17l4.5-4.2 3.2 3 3-2.6 4.3 3.8"/></svg>
    </div>
    <div class="navBtn" data-i="5" title="Domotique">
      <svg viewBox="0 0 24 24"><path class="ic" d="M4 11.5 12 4l8 7.5"/><path class="ic" d="M6 10.5V20h12v-9.5"/><path class="ic" d="M10 20v-5h4v5"/></svg>
    </div>
    <div class="navBtn" data-i="6" title="Chauffage">
      <svg viewBox="0 0 24 24"><path class="ic" d="M10 13.5V5a2 2 0 0 1 4 0v8.5a4 4 0 1 1-4 0z"/><path class="ic" d="M12 9v6"/></svg>
    </div>
    <div class="navBtn" data-i="7" title="Musique">
      <svg viewBox="0 0 24 24"><path class="ic" d="M9 17.5V5l10-2v12.5"/><circle class="ic" cx="6.5" cy="18" r="2.5"/><circle class="ic" cx="16.5" cy="16" r="2.5"/></svg>
    </div>
  </div>

  <div id="stageWrap">
    <iframe class="slide" id="s0" src="slide-aujourdhui.html"></iframe>
    <iframe class="slide" id="s1" src="slide-courses.html"></iframe>
    <iframe class="slide" id="s2" src="slide-agenda.html"></iframe>
    <iframe class="slide" id="s3" src="slide-trajets.html"></iframe>
    <iframe class="slide" id="s4" src="slide-photos.html"></iframe>
    <iframe class="slide" id="s5" src="slide-domotique.html"></iframe>
    <iframe class="slide" id="s6" src="slide-chauffage.html"></iframe>
    <iframe class="slide" id="s7" src="slide-musique.html"></iframe>
    <iframe class="slide" id="s8" src="slide-reglages.html"></iframe>
    <div id="prog"><div id="progFill"></div></div>
    <div id="pauseBadge" title="Reprendre le défilement"><svg viewBox="0 0 24 24"><path class="ic" d="M7 5l12 7-12 7z"/></svg></div>
  </div>
  <div id="veille"><div id="vclock"></div></div>

<script>
/* ---------- config du cadre (stockée en local, réglable via la slide Réglages) ---------- */
var N = 9;
var NAMES = ["aujourdhui","courses","agenda","trajets","photos","domotique","chauffage","musique","reglages"];
var SLIDE_IX = { aujourdhui:0, courses:1, agenda:2, trajets:3, photos:4, domotique:5, chauffage:6, musique:7, reglages:8 };
var DEFAULT_PAGES = {
  aujourdhui:{sec:30,rot:true}, courses:{sec:30,rot:true}, agenda:{sec:30,rot:false},
  trajets:{sec:30,rot:true}, photos:{sec:40,rot:true}, domotique:{sec:30,rot:true},
  chauffage:{sec:30,rot:true}, musique:{sec:30,rot:true}
};
var DEFAULT_VEILLE = { enabled:false, start:"23:00", end:"07:00", wake:120 };
function merge(d,o){ var r={}; for(var k in d) r[k]=d[k]; if(o) for(var k2 in o){ if(o[k2]!=null) r[k2]=o[k2]; } return r; }
function getCfg(){
  var c={}; try{ c=JSON.parse(localStorage.getItem("cadreCfg")||"{}")||{}; }catch(e){}
  var cfg={ veille: merge(DEFAULT_VEILLE, c.veille), pages:{} };
  for(var n in DEFAULT_PAGES){ cfg.pages[n]=merge(DEFAULT_PAGES[n], c.pages && c.pages[n]); }
  return cfg;
}
var CFG = getCfg();
function pad(n){ return n<10?"0"+n:""+n; }
function inRotation(i){ var n=NAMES[i]; if(n==="reglages") return false; var pg=CFG.pages[n]; return pg?!!pg.rot:true; }
function durOf(i){ var n=NAMES[i], pg=CFG.pages[n]; return (pg&&pg.sec?pg.sec:30)*1000; }

function currentTheme(){ var ov=(location.search.match(/theme=(light|dark)/)||[])[1]; return ov||"light"; }
function applyTheme(){ document.documentElement.setAttribute("data-theme", currentTheme()); }
applyTheme();

var PAUSE_MS = 60000;
var cur=-1, timer=null, start=0, paused=false, pauseTimer=null;
var slides=[]; for(var si=0; si<N; si++) slides.push(document.getElementById("s"+si));
var btns=document.getElementsByClassName("navBtn");
var progFill=document.getElementById("progFill");
var pauseBadge=document.getElementById("pauseBadge");

function show(i){
  if(i===cur){ restart(); return; }
  cur=i;
  for(var k=0;k<N;k++){
    if(k===i){ slides[k].className="slide on"; if(btns[k]) btns[k].className="navBtn active"; }
    else { slides[k].className="slide"; if(btns[k]) btns[k].className="navBtn"; }
  }
  restart();
}
window.goSlideName=function(name){ var i=SLIDE_IX[name]; if(i!=null){ show(i); pauseRotation(); } };

function next(){ var i=cur; for(var k=0;k<N;k++){ i=(i+1)%N; if(inRotation(i)) break; } show(i); }
function restart(){ start=Date.now(); if(timer) clearTimeout(timer); if(!paused) timer=setTimeout(next, durOf(cur)); }

/* pause au toucher */
function pauseRotation(){ paused=true; if(timer){clearTimeout(timer);timer=null;} if(pauseBadge) pauseBadge.className="on"; if(pauseTimer) clearTimeout(pauseTimer); pauseTimer=setTimeout(resumeRotation,PAUSE_MS); }
function resumeRotation(){ paused=false; if(pauseTimer){clearTimeout(pauseTimer);pauseTimer=null;} if(pauseBadge) pauseBadge.className=""; restart(); }
function attachTouch(fr){ try{ var d=fr.contentDocument||(fr.contentWindow&&fr.contentWindow.document); if(!d) return; d.addEventListener("touchstart",pauseRotation,true); d.addEventListener("mousedown",pauseRotation,true); }catch(e){} }

function loop(){ var dur=durOf(cur); var f=paused?0:Math.min(1,(Date.now()-start)/dur); progFill.style.width=(f*100)+"%"; window.requestAnimationFrame?requestAnimationFrame(loop):setTimeout(loop,100); }

for(var kb=0;kb<btns.length;kb++){ (function(idx){ btns[idx].onclick=function(){ show(idx); pauseRotation(); }; })(kb); }
for(var t=0;t<N;t++){ (function(fr){ if(fr){ fr.addEventListener("load",function(){ attachTouch(fr); }); attachTouch(fr); } })(slides[t]); }
if(pauseBadge) pauseBadge.onclick=resumeRotation;

/* ---------- veille (nuit) ---------- */
var veilleEl=document.getElementById("veille"), vclockEl=document.getElementById("vclock"), wakeUntil=0;
function parisHM(){ try{ return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date()); }catch(e){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); } }
function inWin(a,b,hm){ if(!a||!b||a===b) return false; return a<b?(hm>=a&&hm<b):(hm>=a||hm<b); }
function veilleActive(){ return !!(CFG.veille.enabled && inWin(CFG.veille.start, CFG.veille.end, parisHM())); }
function applyVeille(){ var on = veilleActive() && Date.now()>=wakeUntil; if(veilleEl) veilleEl.className=on?"on":""; if(on && vclockEl){ var d=new Date(); vclockEl.textContent=pad(d.getHours())+":"+pad(d.getMinutes()); } }
if(veilleEl){ veilleEl.onclick=function(){ wakeUntil=Date.now()+(CFG.veille.wake||120)*1000; applyVeille(); }; }

/* messages depuis les slides */
window.addEventListener("message", function(e){
  if(e.data==="cadre-stay") pauseRotation();
  else if(e.data==="cadre-reload"){ try{ location.reload(); }catch(_){} }
  else if(e.data==="cadre-cfg"){ CFG=getCfg(); applyVeille(); if(!paused) restart(); }
});

show(0);
loop();
applyVeille();
setInterval(applyVeille, 15000);

/* filet de sécurité : recharge le dashboard 1x par heure */
setInterval(function(){ try{ location.reload(); }catch(e){} }, 60*60*1000);
</script>
</body>
</html>

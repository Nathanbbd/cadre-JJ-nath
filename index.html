<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadre maison — Levallois</title>
<style>
  /* Shell. Nav verticale à GAUCHE. Palette crème + jaune, claire par défaut.
     Compatible WebView Android 6 / Chrome 106. */
  :root {
    --shellbg:#f4f1ea; --navbg:#fbfaf6; --navsep:rgba(40,36,30,0.08);
    --navic:#8d877b; --navactive:#f2b600; --navactiveic:#2e2b26; --prog:#f2b600;
  }
  :root[data-theme="dark"] {
    --shellbg:#1b1a16; --navbg:#201e19; --navsep:rgba(255,255,255,0.08);
    --navic:#b3ab99; --navactive:#f2b600; --navactiveic:#201e19; --prog:#f2b600;
  }
  html, body { margin: 0; height: 100%; background: var(--shellbg); overflow: hidden; }
  body { font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
         display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }

  /* Barre de nav verticale à gauche */
  #nav {
    width: 74px; height: 100vh; background: var(--navbg);
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-flex: none; flex: none; z-index: 10;
    border-right: 1px solid var(--navsep);
  }
  .navBtn {
    -webkit-flex: 1; flex: 1; width: 100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    cursor: pointer; border-bottom: 1px solid var(--navsep);
    -webkit-transition: background 0.25s ease; transition: background 0.25s ease;
  }
  .navBtn:last-child { border-bottom: 0; }
  .navBtn svg { width: 26px; height: 26px; display: block; }
  .navBtn .ic { fill: none; stroke: var(--navic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navBtn.active { background: var(--navactive); }
  .navBtn.active .ic { stroke: var(--navactiveic); }

  /* Zone des slides */
  #stageWrap { -webkit-flex: 1; flex: 1; position: relative; height: 100vh; }
  .slide {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; -webkit-transition: opacity 0.6s ease; transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.on { opacity: 1; pointer-events: auto; }

  /* Liseré de progression en haut de la zone slides */
  #prog { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 11; }
  #progFill { height: 100%; width: 0; background: var(--prog); }

  /* Badge "en pause" (quand on touche une slide) */
  #pauseBadge {
    position: absolute; left: 50%; bottom: 22px; -webkit-transform: translateX(-50%); transform: translateX(-50%);
    z-index: 20; display: none; -webkit-align-items: center; align-items: center;
    background: var(--navactive); color: var(--navactiveic); font-family: "Roboto", Arial, sans-serif;
    font-size: 19px; font-weight: 600; padding: 11px 20px; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.22); cursor: pointer;
  }
  #pauseBadge.on { display: -webkit-flex; display: flex; }
  #pauseBadge svg { width: 20px; height: 20px; margin-right: 10px; }
  #pauseBadge .ic { fill: var(--navactiveic); }
</style>
</head>
<body>

  <div id="nav">
    <div class="navBtn" data-i="0" title="Aujourd'hui">
      <svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="4"/><path class="ic" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
    </div>
    <div class="navBtn" data-i="1" title="Domotique">
      <svg viewBox="0 0 24 24"><path class="ic" d="M4 11.5 12 4l8 7.5"/><path class="ic" d="M6 10.5V20h12v-9.5"/><path class="ic" d="M10 20v-5h4v5"/></svg>
    </div>
    <div class="navBtn" data-i="2" title="Chauffage">
      <svg viewBox="0 0 24 24"><path class="ic" d="M10 13.5V5a2 2 0 0 1 4 0v8.5a4 4 0 1 1-4 0z"/><path class="ic" d="M12 9v6"/></svg>
    </div>
    <div class="navBtn" data-i="3" title="Courses &amp; tâches">
      <svg viewBox="0 0 24 24"><path class="ic" d="M4.5 8.5h15l-1.4 10.2a1 1 0 0 1-1 .8H6.9a1 1 0 0 1-1-.8z"/><path class="ic" d="M8 8.5a4 4 0 0 1 8 0"/><path class="ic" d="M9.3 12v4m5.4-4v4"/></svg>
    </div>
    <div class="navBtn" data-i="4" title="Photos">
      <svg viewBox="0 0 24 24"><rect class="ic" x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle class="ic" cx="9" cy="10.5" r="1.8"/><path class="ic" d="M4.5 17l4.5-4.2 3.2 3 3-2.6 4.3 3.8"/></svg>
    </div>
    <div class="navBtn" data-i="5" title="Trajets">
      <svg viewBox="0 0 24 24"><rect class="ic" x="6" y="3.5" width="12" height="13.5" rx="3.5"/><path class="ic" d="M6 10.5h12"/><path class="ic" d="M9 7h6"/><path class="ic" d="M8.5 17 6.5 20.5M15.5 17l2 3.5"/></svg>
    </div>
  </div>

  <div id="stageWrap">
    <iframe class="slide" id="s0" src="slide-aujourdhui.html"></iframe>
    <iframe class="slide" id="s1" src="slide-domotique.html"></iframe>
    <iframe class="slide" id="s2" src="slide-chauffage.html"></iframe>
    <iframe class="slide" id="s3" src="slide-courses.html"></iframe>
    <iframe class="slide" id="s4" src="slide-photos.html"></iframe>
    <iframe class="slide" id="s5" src="slide-trajets.html"></iframe>
    <iframe class="slide" id="s6" src="slide-agenda.html"></iframe>
    <div id="prog"><div id="progFill"></div></div>
    <div id="pauseBadge"><svg viewBox="0 0 24 24"><rect class="ic" x="6" y="5" width="4" height="14" rx="1"/><rect class="ic" x="14" y="5" width="4" height="14" rx="1"/></svg>En pause · touchez pour reprendre</div>
  </div>

<script>
/* ---------- réglages ---------- */
var ROTATE_MS = 30000;
var N = 7;
var TRAJETS_I = 5;   /* slide "Trajets" : dans la rotation seulement en semaine 6h-10h, sinon onglet */
var AGENDA_I = 6;    /* slide "Agenda" : accessible au clic depuis l'Accueil, jamais en rotation auto */
function inRotation(i) {
  if (i === AGENDA_I) return false;
  if (i !== TRAJETS_I) return true;
  var d = new Date(), day = d.getDay(), h = d.getHours();
  return (day >= 1 && day <= 5 && h >= 6 && h < 10);
}
var SLIDE_IX = { aujourdhui: 0, domotique: 1, chauffage: 2, courses: 3, photos: 4, trajets: 5, agenda: 6 };

/* Thème : clair par défaut (crème/jaune). ?theme=dark pour tester le sombre. */
function currentTheme() {
  var ov = (location.search.match(/theme=(light|dark)/) || [])[1];
  return ov || "light";
}
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
applyTheme();

var PAUSE_MS = 60000;   /* reprise auto 60 s après le dernier toucher */
var cur = -1, timer = null, start = 0, paused = false, pauseTimer = null;
var slides = [];
for (var si = 0; si < N; si++) slides.push(document.getElementById("s" + si));
var btns = document.getElementsByClassName("navBtn");
var progFill = document.getElementById("progFill");
var pauseBadge = document.getElementById("pauseBadge");

function show(i) {
  if (i === cur) { restart(); return; }
  cur = i;
  for (var k = 0; k < N; k++) {
    if (k === i) { slides[k].className = "slide on"; if (btns[k]) btns[k].className = "navBtn active"; }
    else { slides[k].className = "slide"; if (btns[k]) btns[k].className = "navBtn"; }
  }
  restart();
}
/* navigation par nom (ex. une slide peut ouvrir l'agenda) */
window.goSlideName = function (name) { var i = SLIDE_IX[name]; if (i != null) { show(i); pauseRotation(); } };

function next() {
  var i = cur;
  for (var k = 0; k < N; k++) { i = (i + 1) % N; if (inRotation(i)) break; }
  show(i);
}

function restart() {
  start = Date.now();
  if (timer) clearTimeout(timer);
  if (!paused) timer = setTimeout(next, ROTATE_MS);
}

/* ---------- pause au toucher ---------- */
function pauseRotation() {
  paused = true;
  if (timer) { clearTimeout(timer); timer = null; }
  if (pauseBadge) pauseBadge.className = "on";
  if (pauseTimer) clearTimeout(pauseTimer);
  pauseTimer = setTimeout(resumeRotation, PAUSE_MS);
}
function resumeRotation() {
  paused = false;
  if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
  if (pauseBadge) pauseBadge.className = "";
  restart();
}
function attachTouch(fr) {
  try {
    var d = fr.contentDocument || (fr.contentWindow && fr.contentWindow.document);
    if (!d) return;
    d.addEventListener("touchstart", pauseRotation, true);
    d.addEventListener("mousedown", pauseRotation, true);
  } catch (e) {}
}

function loop() {
  var f = paused ? 0 : Math.min(1, (Date.now() - start) / ROTATE_MS);
  progFill.style.width = (f * 100) + "%";
  window.requestAnimationFrame ? requestAnimationFrame(loop) : setTimeout(loop, 100);
}

for (var k = 0; k < btns.length; k++) {
  (function (idx) { btns[idx].onclick = function () { show(idx); pauseRotation(); }; })(k);
}
for (var t = 0; t < N; t++) {
  (function (fr) { if (fr) { fr.addEventListener("load", function () { attachTouch(fr); }); attachTouch(fr); } })(slides[t]);
}
if (pauseBadge) pauseBadge.onclick = resumeRotation;

/* Une slide peut demander à rester affichée (ex. réglage du chauffage) : on met en pause */
window.addEventListener("message", function (e) { if (e.data === "cadre-stay") pauseRotation(); });

show(0);
loop();

/* Filet de sécurité : recharge tout le dashboard une fois par heure. */
setInterval(function () { try { location.reload(); } catch (e) {} }, 60 * 60 * 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nos listes">
<meta name="theme-color" content="#f6f4ef">
<title>Nos listes</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --muted:#8d877b; --faint:#bdb6a6; --line:#eee9df;
          --accent:#f0a500; --accentsoft:#fdf1d6; --danger:#d9674e; --done:#b7b0a2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111010; --card:#1d1b18; --ink:#f3efe6; --muted:#a39c8d; --faint:#6f685c; --line:#2c2821;
            --accent:#f2b63a; --accentsoft:#352b16; --danger:#e07a63; --done:#6f685c; }
  }
  * { -webkit-box-sizing:border-box; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { padding:env(safe-area-inset-top) 0 0; -webkit-user-select:none; user-select:none; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px calc(120px + env(safe-area-inset-bottom)); }

  header { padding:14px 2px 6px; }
  h1 { font-size:34px; font-weight:800; margin:4px 0 14px; letter-spacing:-0.5px; }

  /* segmented Courses / Tâches */
  .seg { display:flex; background:var(--line); border-radius:12px; padding:3px; }
  .seg button { flex:1; border:0; background:transparent; font:inherit; font-size:16px; font-weight:600;
    color:var(--muted); padding:9px 0; border-radius:9px; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .seg .n { font-size:13px; color:var(--faint); font-weight:700; margin-left:5px; }

  .list { margin-top:16px; background:var(--card); border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:14px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .ck { width:27px; height:27px; border-radius:50%; border:2px solid var(--faint); flex:none; margin-right:14px;
    position:relative; cursor:pointer; transition:.15s; }
  .row.done .ck { background:var(--accent); border-color:var(--accent); }
  .row.done .ck:after { content:""; position:absolute; left:9px; top:4px; width:6px; height:12px;
    border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }
  .tx { flex:1; font-size:19px; line-height:1.25; word-break:break-word; cursor:text; }
  .row.done .tx { color:var(--done); text-decoration:line-through; }
  .txedit { flex:1; font:inherit; font-size:19px; color:var(--ink); background:transparent; border:0; border-bottom:2px solid var(--accent);
    padding:1px 0 3px; outline:none; -webkit-user-select:auto; user-select:auto; }
  .del { flex:none; width:34px; height:34px; border:0; background:transparent; color:var(--faint);
    font-size:22px; cursor:pointer; opacity:.6; }
  .del:active { color:var(--danger); opacity:1; }

  .empty { padding:26px 16px; text-align:center; color:var(--faint); font-size:17px; }
  .clear { margin:12px 4px 0; text-align:center; }
  .clear button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:15px; cursor:pointer; text-decoration:underline; }

  /* barre d'ajout fixe en bas */
  .addbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .addbar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; }
  .addbar .plus { width:30px; height:30px; flex:none; border-radius:50%; background:var(--accent); color:#fff;
    font-size:22px; line-height:28px; text-align:center; margin-right:12px; }
  .addbar input { flex:1; border:0; background:transparent; font:inherit; font-size:19px; color:var(--ink); padding:8px 0; outline:none; -webkit-user-select:auto; user-select:auto; }
  .addbar input::placeholder { color:var(--faint); }

  #sync { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:14px; font-size:12px; color:var(--faint); }
  .hidden { display:none !important; }

  /* menu de la semaine */
  .day { background:var(--card); border-radius:16px; margin-top:12px; overflow:hidden; }
  .dayh { display:flex; align-items:center; padding:15px 16px; cursor:pointer; }
  .dayh .dn { font-size:18px; font-weight:700; width:104px; flex:none; }
  .dayh .dp { flex:1; font-size:17px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dayh .dp.has { color:var(--ink); font-weight:500; }
  .dayh .chev { color:var(--faint); font-size:15px; margin-left:8px; flex:none; }
  .dbody { padding:2px 16px 16px; }
  .mlabel { font-size:12px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin:14px 0 7px; }
  .minput { width:100%; border:0; background:var(--accentsoft); border-radius:11px; padding:12px 13px; font:inherit; font-size:18px; color:var(--ink); outline:none; -webkit-user-select:auto; user-select:auto; }
  .ingr { display:flex; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .ingr:first-of-type { border-top:0; }
  .ingr .it { flex:1; font-size:17px; }
  .ingr .x { flex:none; border:0; background:transparent; color:var(--faint); font-size:20px; width:30px; }
  .iadd { display:flex; align-items:center; margin-top:4px; }
  .iadd .p { flex:none; color:var(--accent); font-size:22px; margin-right:11px; }
  .iadd input { flex:1; border:0; background:transparent; font:inherit; font-size:17px; color:var(--ink); padding:9px 0; outline:none; -webkit-user-select:auto; user-select:auto; }
  .iadd input::placeholder { color:var(--faint); }

  /* section « tous les ingrédients » + envoi */
  .aggsec { background:var(--card); border-radius:16px; margin-top:20px; padding:4px 16px 10px; }
  .aggsec .mlabel { margin:13px 2px 4px; }
  .ck2 { width:26px; height:26px; border-radius:50%; border:2px solid var(--faint); flex:none; margin-right:14px; position:relative; cursor:pointer; }
  .ck2.on { background:var(--accent); border-color:var(--accent); }
  .ck2.on:after { content:""; position:absolute; left:9px; top:4px; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }
  .it.off { color:var(--done); text-decoration:line-through; }
  .sendbtn { display:block; width:100%; margin:14px 0 4px; border:0; border-radius:14px; background:var(--accent); color:#fff;
    font:inherit; font-size:18px; font-weight:700; padding:16px 0; cursor:pointer; }
  .sendbtn:active { opacity:.85; }
  .sendbtn:disabled { background:var(--line); color:var(--faint); }
</style>
</head>
<body>
<div id="sync"></div>
<div class="wrap">
  <header>
    <h1>Nos listes</h1>
    <div class="seg">
      <button id="segC" class="on" onclick="setTab('courses')">Courses<span class="n" id="nC"></span></button>
      <button id="segT" onclick="setTab('taches')">Tâches<span class="n" id="nT"></span></button>
      <button id="segM" onclick="setTab('menu')">Menu</button>
    </div>
  </header>

  <div class="list" id="list"></div>
  <div class="clear"><button id="clearBtn" onclick="clearDone()">Effacer les articles cochés</button></div>
</div>

<div class="addbar" id="addbar">
  <div class="in">
    <div class="plus">+</div>
    <input id="add" type="text" enterkeyhint="done" autocapitalize="sentences" autocomplete="off"
           placeholder="Ajouter un article…">
  </div>
</div>

<script>
var WORKER = "https://liste-appart.boisbourdinnathande.workers.dev";
var tab = "courses", DATA = { courses: [], taches: [], hasTaches: true, menu: {} }, typing = false, busy = false;
var DAYS = ["lun","mar","mer","jeu","ven","sam","dim"];
var DAYNAMES = { lun:"Lundi", mar:"Mardi", mer:"Mercredi", jeu:"Jeudi", ven:"Vendredi", sam:"Samedi", dim:"Dimanche" };
var openDay = DAYS[(new Date().getDay()+6)%7];   /* ouvre le jour d'aujourd'hui */
var menuExclude = {};   /* ingrédients décochés (ne seront pas envoyés) */

function el(id){ return document.getElementById(id); }

function api(path, cb){
  var url = WORKER + path + (path.indexOf("?")<0?"?":"&") + "t_=" + Date.now();
  var x = new XMLHttpRequest(); x.open("GET", url); x.timeout = 15000;
  x.onload = function(){
    try { var j = JSON.parse(x.responseText); if (j && j.courses){ DATA = j; if (!typing) render(); } } catch(e){}
    if (cb) cb();
  };
  x.onerror = x.ontimeout = function(){ setSync("hors ligne"); };
  x.send();
}

function load(){ if (!busy) api("/"); }
function setTab(t){ tab = t; el("segC").className = t==="courses"?"on":""; el("segT").className = t==="taches"?"on":""; el("segM").className = t==="menu"?"on":""; render(); }

function setSync(s){ el("sync").textContent = s || ""; if (s) setTimeout(function(){ if(el("sync").textContent===s) el("sync").textContent=""; }, 1500); }

function items(){ return tab==="taches" ? DATA.taches : DATA.courses; }

function render(){
  el("nC").textContent = DATA.courses.filter(function(x){return !x.done;}).length || "";
  el("nT").textContent = DATA.taches.filter(function(x){return !x.done;}).length || "";
  var isMenu = (tab === "menu");
  el("addbar").className = isMenu ? "addbar hidden" : "addbar";
  if (isMenu) { renderMenu(); return; }
  var L = items().slice().sort(function(a,b){ return (a.done?1:0)-(b.done?1:0); });
  if (!L.length){ el("list").innerHTML = '<div class="empty">Rien pour l\'instant.</div>'; el("clearBtn").className="hidden"; return; }
  var anyDone = L.some(function(x){return x.done;});
  el("clearBtn").className = anyDone ? "" : "hidden";
  var h = "";
  for (var i=0;i<L.length;i++){
    var id = L[i].id, isEdit = (id === editingId);
    h += '<div class="row'+(L[i].done?' done':'')+'">'
       + '<div class="ck" onclick="toggle(\''+id+'\')"></div>'
       + (isEdit
          ? '<input class="txedit" id="edit_'+id+'" value="'+escAttr(L[i].t)+'" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" onblur="commitEdit(\''+id+'\')" onkeydown="if(event.keyCode===13){this.blur();}">'
          : '<div class="tx" onclick="startEdit(\''+id+'\')">'+esc(L[i].t)+'</div>')
       + '<button class="del" onclick="del(\''+id+'\')">&times;</button></div>';
  }
  el("list").innerHTML = h;
  if (editingId){ var inp = el("edit_"+editingId); if (inp){ inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} } }
}

/* édition d'un article : taper le texte -> champ modifiable */
var editingId = null;
function startEdit(id){ editingId = id; typing = true; render(); }
function commitEdit(id){
  var inp = el("edit_"+id); editingId = null; typing = false;
  if (!inp){ render(); return; }
  var v = inp.value.trim(), it = null;
  [DATA.courses, DATA.taches].forEach(function(L){ L.forEach(function(x){ if(x.id===id) it=x; }); });
  if (it && v && v !== it.t){ it.t = v; busy = true; api("/rename?id="+id+"&t="+encodeURIComponent(v), function(){ busy=false; }); }
  render();
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

/* ---------- menu de la semaine ---------- */
function mday(k){ var m = DATA.menu && DATA.menu[k]; return (m && typeof m==="object") ? { plat:m.plat||"", ingr:m.ingr||[] } : { plat:"", ingr:[] }; }
function renderMenu(){
  el("clearBtn").className = "hidden";
  var h = "";
  for (var i=0;i<DAYS.length;i++){
    var k = DAYS[i], m = mday(k), open = (openDay===k);
    h += '<div class="day"><div class="dayh" onclick="toggleDay(\''+k+'\')">'
       + '<div class="dn">'+DAYNAMES[k]+'</div>'
       + '<div class="dp'+(m.plat?' has':'')+'">'+(m.plat?esc(m.plat):'—')+'</div>'
       + '<div class="chev">'+(open?'▾':'▸')+'</div></div>';
    if (open){
      h += '<div class="dbody"><div class="mlabel">Plat</div>'
         + '<input class="minput" id="plat_'+k+'" placeholder="Qu\'est-ce qu\'on mange ?" value="'+escAttr(m.plat)+'" '
         + 'onfocus="typing=true" onblur="typing=false;savePlat(\''+k+'\')" onkeydown="if(event.keyCode===13){this.blur();}">'
         + '<div class="mlabel">Ingrédients</div>';
      for (var j=0;j<m.ingr.length;j++){
        h += '<div class="ingr"><div class="it">'+esc(m.ingr[j].t)+'</div>'
           + '<button class="x" onclick="menuDel(\''+k+'\',\''+m.ingr[j].id+'\')">&times;</button></div>';
      }
      h += '<div class="iadd"><div class="p">+</div>'
         + '<input id="iadd_'+k+'" placeholder="Ajouter un ingrédient…" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" '
         + 'onfocus="typing=true" onblur="typing=false" onkeydown="if(event.keyCode===13){menuAdd(\''+k+'\',this.value);this.value=\'\';event.preventDefault();}"></div>';
      h += '</div>';
    }
    h += '</div>';
  }
  /* --- tous les ingrédients de la semaine (uniques) + envoi vers les courses --- */
  var agg = aggIngredients(), sel = 0;
  if (agg.length){
    h += '<div class="aggsec"><div class="mlabel">Tous les ingrédients</div>';
    for (var a=0;a<agg.length;a++){
      var name = agg[a], excl = !!menuExclude[name.toLowerCase()]; if (!excl) sel++;
      h += '<div class="ingr"><div class="ck2'+(excl?'':' on')+'" onclick="toggleExcl(\''+escAttr(name).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')"></div>'
         + '<div class="it'+(excl?' off':'')+'">'+esc(name)+'</div></div>';
    }
    h += '</div>';
    h += '<button class="sendbtn" id="sendBtn"'+(sel?'':' disabled')+' onclick="sendMenu()">Envoyer dans les courses'+(sel?' ('+sel+')':'')+'</button>';
  }
  el("list").innerHTML = h;
}
function aggIngredients(){
  var seen = {}, out = [];
  for (var i=0;i<DAYS.length;i++){ var ing = mday(DAYS[i]).ingr; for (var j=0;j<ing.length;j++){ var t=(ing[j].t||"").trim(), key=t.toLowerCase(); if (t && !seen[key]){ seen[key]=true; out.push(t); } } }
  return out;
}
function toggleExcl(name){ var k=name.toLowerCase(); menuExclude[k] = !menuExclude[k]; render(); }
function sendMenu(){
  var agg = aggIngredients(), items = agg.filter(function(n){ return !menuExclude[n.toLowerCase()]; });
  if (!items.length) return;
  var existing = {}; DATA.courses.forEach(function(x){ existing[x.t.toLowerCase()] = true; });
  items.forEach(function(t){ if (!existing[t.toLowerCase()]){ DATA.courses.push({ id:"tmp"+Date.now()+Math.random(), t:t, done:false }); } });
  render(); setSync("Ajouté aux courses ✓");
  busy=true; api("/addMany?list=courses&items="+encodeURIComponent(items.join("\n")), function(){ busy=false; });
}
function toggleDay(k){ openDay = (openDay===k) ? null : k; render(); }
function savePlat(k){
  var inp = el("plat_"+k); if (!inp) return;
  var v = inp.value.trim(); if (!DATA.menu[k]) DATA.menu[k] = { plat:"", ingr:[] };
  if (DATA.menu[k].plat === v) return;
  DATA.menu[k].plat = v; busy = true; api("/menuPlat?day="+k+"&t="+encodeURIComponent(v), function(){ busy=false; });
}
function menuAdd(k,t){
  t=(t||"").trim(); if(!t) return;
  if (!DATA.menu[k]) DATA.menu[k] = { plat:"", ingr:[] };
  DATA.menu[k].ingr.push({ id:"tmp"+Date.now(), t:t }); render();
  var f = el("iadd_"+k); if (f) f.focus();                 /* garde le clavier ouvert */
  busy=true; api("/menuAdd?day="+k+"&t="+encodeURIComponent(t), function(){ busy=false; });
}
function menuDel(k,id){
  if (DATA.menu[k]) DATA.menu[k].ingr = DATA.menu[k].ingr.filter(function(x){ return x.id!==id; });
  render(); busy=true; api("/menuDel?day="+k+"&id="+id, function(){ busy=false; });
}

/* actions optimistes : on met à jour l'écran tout de suite, puis on confirme au serveur */
function toggle(id){
  [DATA.courses,DATA.taches].forEach(function(Lx){ Lx.forEach(function(it){ if(it.id===id) it.done=!it.done; }); });
  render(); busy=true; api("/toggle?id="+id, function(){ busy=false; });
}
function del(id){
  ["courses","taches"].forEach(function(k){ DATA[k]=DATA[k].filter(function(x){return x.id!==id;}); });
  render(); busy=true; api("/del?id="+id, function(){ busy=false; });
}
function clearDone(){
  DATA[tab]=DATA[tab].filter(function(x){return !x.done;}); render();
  busy=true; api("/clearDone?list="+tab, function(){ busy=false; });
}
function add(t){
  t=(t||"").trim(); if(!t) return;
  DATA[tab].push({ id:"tmp"+Date.now(), t:t, done:false }); render();
  busy=true; api("/add?list="+tab+"&t="+encodeURIComponent(t), function(){ busy=false; });
}

el("add").addEventListener("focus", function(){ typing=true; });
el("add").addEventListener("blur", function(){ typing=false; });
el("add").addEventListener("keydown", function(e){
  if (e.key==="Enter" || e.keyCode===13){ add(el("add").value); el("add").value=""; e.preventDefault(); }
});

load();
setInterval(function(){ if(!typing && !busy) api("/"); }, 8000);
</script>
</body>
</html>

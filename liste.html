<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nos listes">
<meta name="theme-color" content="#f6f4ef">
<title>Nos listes</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --muted:#8d877b; --faint:#bdb6a6; --line:#eee9df;
          --accent:#f0a500; --accentsoft:#fdf1d6; --danger:#d9674e; --done:#b7b0a2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111010; --card:#1d1b18; --ink:#f3efe6; --muted:#a39c8d; --faint:#6f685c; --line:#2c2821;
            --accent:#f2b63a; --accentsoft:#352b16; --danger:#e07a63; --done:#6f685c; }
  }
  * { -webkit-box-sizing:border-box; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { padding:env(safe-area-inset-top) 0 0; -webkit-user-select:none; user-select:none; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px calc(120px + env(safe-area-inset-bottom)); }

  header { padding:14px 2px 6px; }
  h1 { font-size:34px; font-weight:800; margin:4px 0 14px; letter-spacing:-0.5px; }

  /* segmented Courses / Tâches */
  .seg { display:flex; background:var(--line); border-radius:12px; padding:3px; }
  .seg button { flex:1; border:0; background:transparent; font:inherit; font-size:16px; font-weight:600;
    color:var(--muted); padding:9px 0; border-radius:9px; cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .seg .n { font-size:13px; color:var(--faint); font-weight:700; margin-left:5px; }

  .list { margin-top:16px; background:var(--card); border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:14px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .ck { width:27px; height:27px; border-radius:50%; border:2px solid var(--faint); flex:none; margin-right:14px;
    position:relative; cursor:pointer; transition:.15s; }
  .row.done .ck { background:var(--accent); border-color:var(--accent); }
  .row.done .ck:after { content:""; position:absolute; left:9px; top:4px; width:6px; height:12px;
    border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }
  .tx { flex:1; font-size:19px; line-height:1.25; word-break:break-word; }
  .row.done .tx { color:var(--done); text-decoration:line-through; }
  .del { flex:none; width:34px; height:34px; border:0; background:transparent; color:var(--faint);
    font-size:22px; cursor:pointer; opacity:.6; }
  .del:active { color:var(--danger); opacity:1; }

  .empty { padding:26px 16px; text-align:center; color:var(--faint); font-size:17px; }
  .clear { margin:12px 4px 0; text-align:center; }
  .clear button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:15px; cursor:pointer; text-decoration:underline; }

  /* barre d'ajout fixe en bas */
  .addbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .addbar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; }
  .addbar .plus { width:30px; height:30px; flex:none; border-radius:50%; background:var(--accent); color:#fff;
    font-size:22px; line-height:28px; text-align:center; margin-right:12px; }
  .addbar input { flex:1; border:0; background:transparent; font:inherit; font-size:19px; color:var(--ink); padding:8px 0; outline:none; -webkit-user-select:auto; user-select:auto; }
  .addbar input::placeholder { color:var(--faint); }

  #sync { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:14px; font-size:12px; color:var(--faint); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="sync"></div>
<div class="wrap">
  <header>
    <h1>Nos listes</h1>
    <div class="seg">
      <button id="segC" class="on" onclick="setTab('courses')">Courses<span class="n" id="nC"></span></button>
      <button id="segT" onclick="setTab('taches')">Tâches<span class="n" id="nT"></span></button>
    </div>
  </header>

  <div class="list" id="list"></div>
  <div class="clear"><button id="clearBtn" onclick="clearDone()">Effacer les articles cochés</button></div>
</div>

<div class="addbar">
  <div class="in">
    <div class="plus">+</div>
    <input id="add" type="text" enterkeyhint="done" autocapitalize="sentences" autocomplete="off"
           placeholder="Ajouter un article…">
  </div>
</div>

<script>
var WORKER = "https://liste-appart.boisbourdinnathande.workers.dev";
var tab = "courses", DATA = { courses: [], taches: [], hasTaches: true }, typing = false, busy = false;

function el(id){ return document.getElementById(id); }
function pin(){ try { return localStorage.getItem("listePin") || ""; } catch(e){ return ""; } }
function setPin(v){ try { localStorage.setItem("listePin", v); } catch(e){} }

function api(path, cb){
  var url = WORKER + path + (path.indexOf("?")<0?"?":"&") + "pin=" + encodeURIComponent(pin()) + "&t_=" + Date.now();
  var x = new XMLHttpRequest(); x.open("GET", url); x.timeout = 15000;
  x.onload = function(){
    if (x.status === 401){ askPin(); return; }
    try { var j = JSON.parse(x.responseText); if (j && j.courses){ DATA = j; render(); } } catch(e){}
    if (cb) cb();
  };
  x.onerror = x.ontimeout = function(){ setSync("hors ligne"); };
  x.send();
}
function askPin(){
  var p = prompt("Code pour modifier la liste :", "");
  if (p != null){ setPin(p.trim()); }
}

function load(){ if (!busy) api("/"); }
function setTab(t){ tab = t; el("segC").className = t==="courses"?"on":""; el("segT").className = t==="taches"?"on":""; render(); }

function setSync(s){ el("sync").textContent = s || ""; if (s) setTimeout(function(){ if(el("sync").textContent===s) el("sync").textContent=""; }, 1500); }

function items(){ return tab==="taches" ? DATA.taches : DATA.courses; }

function render(){
  el("nC").textContent = DATA.courses.filter(function(x){return !x.done;}).length || "";
  el("nT").textContent = DATA.taches.filter(function(x){return !x.done;}).length || "";
  var L = items().slice().sort(function(a,b){ return (a.done?1:0)-(b.done?1:0); });
  if (!L.length){ el("list").innerHTML = '<div class="empty">Rien pour l\'instant.</div>'; el("clearBtn").className="hidden"; return; }
  var anyDone = L.some(function(x){return x.done;});
  el("clearBtn").className = anyDone ? "" : "hidden";
  var h = "";
  for (var i=0;i<L.length;i++){
    h += '<div class="row'+(L[i].done?' done':'')+'">'
       + '<div class="ck" onclick="toggle(\''+L[i].id+'\')"></div>'
       + '<div class="tx">'+esc(L[i].t)+'</div>'
       + '<button class="del" onclick="del(\''+L[i].id+'\')">&times;</button></div>';
  }
  el("list").innerHTML = h;
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* actions optimistes : on met à jour l'écran tout de suite, puis on confirme au serveur */
function toggle(id){
  [DATA.courses,DATA.taches].forEach(function(Lx){ Lx.forEach(function(it){ if(it.id===id) it.done=!it.done; }); });
  render(); busy=true; api("/toggle?id="+id, function(){ busy=false; });
}
function del(id){
  ["courses","taches"].forEach(function(k){ DATA[k]=DATA[k].filter(function(x){return x.id!==id;}); });
  render(); busy=true; api("/del?id="+id, function(){ busy=false; });
}
function clearDone(){
  DATA[tab]=DATA[tab].filter(function(x){return !x.done;}); render();
  busy=true; api("/clearDone?list="+tab, function(){ busy=false; });
}
function add(t){
  t=(t||"").trim(); if(!t) return;
  DATA[tab].push({ id:"tmp"+Date.now(), t:t, done:false }); render();
  busy=true; api("/add?list="+tab+"&t="+encodeURIComponent(t), function(){ busy=false; });
}

el("add").addEventListener("focus", function(){ typing=true; });
el("add").addEventListener("blur", function(){ typing=false; });
el("add").addEventListener("keydown", function(e){
  if (e.key==="Enter" || e.keyCode===13){ add(el("add").value); el("add").value=""; e.preventDefault(); }
});

load();
setInterval(function(){ if(!typing && !busy) api("/"); }, 8000);
</script>
</body>
</html>

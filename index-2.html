<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadre maison — Levallois</title>
<style>
  /* Shell. Nav verticale à GAUCHE. Palette crème + jaune, claire par défaut.
     Compatible WebView Android 6 / Chrome 106. */
  :root {
    --shellbg:#f4f1ea; --navbg:#fbfaf6; --navsep:rgba(40,36,30,0.08);
    --navic:#8d877b; --navactive:#f2b600; --navactiveic:#2e2b26; --prog:#f2b600;
  }
  :root[data-theme="dark"] {
    --shellbg:#1b1a16; --navbg:#201e19; --navsep:rgba(255,255,255,0.08);
    --navic:#b3ab99; --navactive:#f2b600; --navactiveic:#201e19; --prog:#f2b600;
  }
  html, body { margin: 0; height: 100%; background: var(--shellbg); overflow: hidden; }
  body { font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
         display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }

  /* Barre de nav verticale à gauche */
  #nav {
    width: 74px; height: 100vh; background: var(--navbg);
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-flex: none; flex: none; z-index: 10;
    border-right: 1px solid var(--navsep);
  }
  .navBtn {
    -webkit-flex: 1; flex: 1; width: 100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    cursor: pointer; border-bottom: 1px solid var(--navsep);
    -webkit-transition: background 0.25s ease; transition: background 0.25s ease;
  }
  .navBtn:last-child { border-bottom: 0; }
  .navBtn svg { width: 26px; height: 26px; display: block; }
  .navBtn .ic { fill: none; stroke: var(--navic); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .navBtn.active { background: var(--navactive); }
  .navBtn.active .ic { stroke: var(--navactiveic); }

  /* Zone des slides */
  #stageWrap { -webkit-flex: 1; flex: 1; position: relative; height: 100vh; }
  .slide {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; -webkit-transition: opacity 0.6s ease; transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .slide.on { opacity: 1; pointer-events: auto; }

  /* Liseré de progression en haut de la zone slides */
  #prog { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 11; }
  #progFill { height: 100%; width: 0; background: var(--prog); }
</style>
</head>
<body>

  <div id="nav">
    <div class="navBtn" data-i="0" title="Aujourd'hui">
      <svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="4"/><path class="ic" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
    </div>
    <div class="navBtn" data-i="1" title="Courses &amp; tâches">
      <svg viewBox="0 0 24 24"><path class="ic" d="M4.5 8.5h15l-1.4 10.2a1 1 0 0 1-1 .8H6.9a1 1 0 0 1-1-.8z"/><path class="ic" d="M8 8.5a4 4 0 0 1 8 0"/><path class="ic" d="M9.3 12v4m5.4-4v4"/></svg>
    </div>
    <div class="navBtn" data-i="2" title="Photos">
      <svg viewBox="0 0 24 24"><rect class="ic" x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle class="ic" cx="9" cy="10.5" r="1.8"/><path class="ic" d="M4.5 17l4.5-4.2 3.2 3 3-2.6 4.3 3.8"/></svg>
    </div>
  </div>

  <div id="stageWrap">
    <iframe class="slide" id="s0" src="slide-aujourdhui.html"></iframe>
    <iframe class="slide" id="s1" src="slide-courses.html"></iframe>
    <iframe class="slide" id="s2" src="slide-photos.html"></iframe>
    <div id="prog"><div id="progFill"></div></div>
  </div>

<script>
/* ---------- réglages ---------- */
var ROTATE_MS = 30000;
var N = 3;

/* Thème : clair par défaut (crème/jaune). ?theme=dark pour tester le sombre. */
function currentTheme() {
  var ov = (location.search.match(/theme=(light|dark)/) || [])[1];
  return ov || "light";
}
function applyTheme() { document.documentElement.setAttribute("data-theme", currentTheme()); }
applyTheme();

var cur = -1, timer = null, start = 0;
var slides = [document.getElementById("s0"), document.getElementById("s1"), document.getElementById("s2")];
var btns = document.getElementsByClassName("navBtn");
var progFill = document.getElementById("progFill");

function show(i) {
  if (i === cur) { restart(); return; }
  cur = i;
  for (var k = 0; k < N; k++) {
    if (k === i) { slides[k].className = "slide on"; btns[k].className = "navBtn active"; }
    else { slides[k].className = "slide"; btns[k].className = "navBtn"; }
  }
  restart();
}

function next() { show((cur + 1) % N); }

function restart() {
  start = Date.now();
  if (timer) clearTimeout(timer);
  timer = setTimeout(next, ROTATE_MS);
}

function loop() {
  var f = Math.min(1, (Date.now() - start) / ROTATE_MS);
  progFill.style.width = (f * 100) + "%";
  window.requestAnimationFrame ? requestAnimationFrame(loop) : setTimeout(loop, 100);
}

for (var k = 0; k < N; k++) {
  (function (idx) { btns[idx].onclick = function () { show(idx); }; })(k);
}

show(0);
loop();

/* Filet de sécurité : recharge tout le dashboard une fois par heure. */
setInterval(function () { try { location.reload(); } catch (e) {} }, 60 * 60 * 1000);
</script>
</body>
</html>
